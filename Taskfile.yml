version: "3"

vars:
  GOTOOL: go tool -modfile=tools/go.mod
  DEV_DATABASE_URL: postgres://raptor:raptor@127.0.0.1:54320/raptor
  TEST_DATABASE_URL: postgres://raptor:raptor@127.0.0.1:54321/raptor_test
  VM: raptor-wings

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Install web dependencies and start local services
    cmds:
      - task: web:install
      - task: db:up

  gen:
    desc: Regenerate protobuf, sqlc, and route tree code
    deps: [web:install]
    cmds:
      - "{{.GOTOOL}} buf generate"
      - "{{.GOTOOL}} sqlc generate"
      - pnpm --dir web exec tsr generate

  dev:
    desc: Run Postgres, the Panel API, and the web dev server
    deps: [db:up, web:install]
    cmds:
      - task: migrate
      - task: dev:run

  dev:run:
    internal: true
    deps: [dev:api, dev:web, dev:verify]

  dev:api:
    internal: true
    env:
      PANEL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"
      PANEL_SIGNING_KEY: .dev/panel-signing.key
      PANEL_DATA_KEY: .dev/panel-data.key
      PANEL_APP_URL: http://localhost:5173
      PANEL_MAIL_LOG: "1"
      PANEL_MAIL_LOG_FILE: .dev/mail.txt
      # Cloudflare's Turnstile test secret: every check passes.
      PANEL_TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      # OAuth callbacks come straight to the dev API (the "Raptor
      # (Development)" OAuth apps' redirect URIs).
      PANEL_API_URL: http://localhost:8080
    cmds:
      - test -f .dev/panel-signing.key || go run ./cmd/panel keygen .dev/panel-signing.key
      - test -f .dev/panel-data.key || go run ./cmd/panel keygen .dev/panel-data.key
      # RESEND=1 sends real email with .dev/resend.env (a Resend key for
      # development) instead of writing it to .dev/mail.txt. Use real
      # addresses then: bounces from made-up ones hurt the domain.
      - |
        # OAuth apps for development (git-ignored): PANEL_GITHUB_CLIENT_ID=…
        # and PANEL_GITHUB_CLIENT_SECRET=…, and the same for Google and Discord.
        if [ -f .dev/oauth.env ]; then set -a; . .dev/oauth.env; set +a; fi
        if [ "${RESEND:-}" = 1 ]; then
          [ -f .dev/resend.env ] || { echo "RESEND=1 needs .dev/resend.env (see CONTRIBUTING.md)"; exit 1; }
          set -a; . .dev/resend.env; set +a
          unset PANEL_MAIL_LOG PANEL_MAIL_LOG_FILE
        fi
        exec go run ./cmd/panel serve api

  deploy:rehearse:
    desc: "Rehearse the production setup locally (deploy/): Caddy with client certs, two Panels, streaming replica, pgBackRest to MinIO, restore test, zero-downtime deploy"
    cmds:
      - deploy/scripts/rehearse.sh

  dev:mail:
    desc: "Show the dev Panel's emails (sign-in codes, invitations) as they arrive"
    cmds:
      - mkdir -p .dev && touch .dev/mail.txt
      - tail -n 40 -F .dev/mail.txt

  dev:join-token:
    desc: "A join token for the dev Panel (making a dev org the first time); link the dev VM with: task dev:link"
    env:
      PANEL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"
    cmds:
      - |
        mkdir -p .dev
        test -s .dev/org || go run ./cmd/panel org create "Dev org" > .dev/org
        go run ./cmd/panel join-token "$(cat .dev/org)" dev

  dev:link:
    desc: "Link the dev VM's Wings to the dev Panel on this machine (task dev running)"
    cmds:
      - mkdir -p .dev
      - task dev:join-token > .dev/token
      - limactl shell {{.VM}} sudo raptor link -token "$(tail -1 .dev/token)" -panel http://host.lima.internal:8080

  dev:web:
    internal: true
    dir: web
    env:
      # The verify page on its own origin, and Cloudflare's test site key.
      VITE_TURNSTILE_URL: http://localhost:5174/
      VITE_TURNSTILE_SITEKEY: 1x00000000000000000000AA
    cmds:
      - pnpm dev

  dev:verify:
    internal: true
    dir: web
    cmds:
      - pnpm exec vite verify --port 5174 --strictPort

  migrate:
    desc: Apply Panel migrations to the dev database
    env:
      PANEL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"
    cmds:
      - go run ./cmd/panel migrate

  test:
    desc: Run all tests (Go incl. Postgres, web typecheck)
    deps: [db:up, web:install]
    env:
      PANEL_TEST_DATABASE_URL: "{{.TEST_DATABASE_URL}}"
    cmds:
      - go test -race ./...
      - pnpm --dir web typecheck
      - pnpm --dir web test

  fuzz:
    desc: "Run every fuzz test (FUZZTIME each, default 30s)"
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - |
        set -eu
        for pkg in $(go list ./...); do
          for f in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
            echo "== $pkg $f"
            go test -run '^$' -fuzz "^$f\$" -fuzztime {{.FUZZTIME}} "$pkg"
          done
        done

  lint:
    desc: Lint and format-check Go, proto, and web code
    deps: [web:install]
    cmds:
      - "{{.GOTOOL}} golangci-lint run ./..."
      - "{{.GOTOOL}} golangci-lint fmt --diff ./..."
      - "{{.GOTOOL}} buf lint"
      - pnpm --dir web lint

  fmt:
    desc: Format Go and web code
    deps: [web:install]
    cmds:
      - "{{.GOTOOL}} golangci-lint fmt ./..."
      - pnpm --dir web lint:fix

  check:gen:
    desc: Fail if generated code is out of date
    cmds:
      - task: gen
      - git diff --exit-code -- internal/gen web/src/gen web/src/routeTree.gen.ts ':(glob)internal/*/store/*_gen.go'

  check:licenses:
    desc: Fail on dependencies with non-AGPL-compatible licenses
    deps: [web:install]
    cmds:
      - "{{.GOTOOL}} go-licenses check ./... --allowed_licenses=AGPL-3.0,Apache-2.0,BSD-2-Clause,BSD-3-Clause,CC0-1.0,ISC,MIT,MPL-2.0"
      - pnpm --dir web licenses list --json --prod | node scripts/check-web-licenses.mjs

  check:vuln:
    desc: Scan Go and web dependencies for known vulnerabilities
    deps: [web:install]
    cmds:
      - "{{.GOTOOL}} govulncheck ./..."
      - pnpm --dir web audit --prod

  check:secrets:
    desc: Scan the git history for committed secrets
    cmds:
      # Mounted at the same absolute paths so git worktrees (whose .git file
      # points into the main checkout's .git) work too. A scan that sees no
      # commits fails instead of silently passing.
      - |
        set -eu
        common=$(git rev-parse --path-format=absolute --git-common-dir)
        mounts="-v $PWD:$PWD"
        case "$common" in "$PWD"/*) ;; *) mounts="$mounts -v $common:$common" ;; esac
        out=$(docker run --rm $mounts -w "$PWD" ghcr.io/gitleaks/gitleaks:v8.30.1 git "$PWD" --redact --no-banner 2>&1) || { echo "$out"; exit 1; }
        echo "$out"
        if echo "$out" | grep -q " 0 commits scanned"; then echo "gitleaks scanned no commits"; exit 1; fi

  check:
    desc: Run every check CI runs
    cmds:
      - task: lint
      - task: check:gen
      - task: test
      - task: check:licenses
      - task: check:vuln
      - task: check:secrets

  build:
    desc: Build binaries into bin/ and the web app into web/dist
    deps: [web:install]
    cmds:
      - go build -o bin/panel ./cmd/panel
      - go build -o bin/raptor ./cmd/raptor
      - pnpm --dir web build

  release:sign:
    desc: "Sign and publish a draft release with the offline key (TAG=vX.Y.Z)"
    requires:
      vars: [TAG]
    interactive: true
    cmds:
      - scripts/sign-release.sh {{.TAG}}

  web:install:
    internal: true
    dir: web
    sources: [package.json, pnpm-lock.yaml]
    generates: [node_modules/.modules.yaml]
    cmds:
      - pnpm install --frozen-lockfile

  db:up:
    desc: Start local Postgres (dev + test)
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: Stop local Postgres
    cmds:
      - docker compose down

  db:reset:
    desc: Stop local Postgres and delete its data
    cmds:
      - docker compose down -v

  wings:vm:up:
    desc: Create/start the Debian VM used to run Wings
    cmds:
      # Start the existing VM, or create it on the first run.
      - limactl list -q | grep -qx {{.VM}} && limactl start --tty=false {{.VM}} || limactl start --name={{.VM}} --tty=false dev/lima/wings.yaml
    status:
      - limactl list --format '{{`{{.Status}}`}}' {{.VM}} 2>/dev/null | grep -q Running

  wings:vm:shell:
    desc: Open a shell in the Wings VM
    interactive: true
    cmds:
      - limactl shell {{.VM}}

  wings:vm:deploy:
    desc: Cross-compile raptor for the VM and install it as the current version, like the installer does
    cmds:
      - task: wings:vm:up
      - |
        set -eu
        ARCH=$(limactl shell {{.VM}} dpkg --print-architecture)
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -o bin/raptor-linux-$ARCH ./cmd/raptor
        limactl copy bin/raptor-linux-$ARCH {{.VM}}:/tmp/raptor
        # The self-update layout (docs/WINGS.md#updates).
        limactl shell {{.VM}} sudo bash -euc '
          install -d -m 0755 /usr/local/lib/raptor
          install -m 0755 /tmp/raptor /usr/local/lib/raptor/raptor-dev
          ln -sfn raptor-dev /usr/local/lib/raptor/current
          ln -sfn /usr/local/lib/raptor/current /usr/local/bin/raptor
        '
        limactl shell {{.VM}} raptor version

  wings:vm:install:
    desc: Install raptor, the systemd unit, and a dev config in the VM, and (re)start Wings
    cmds:
      - task: wings:vm:deploy
      - limactl copy install/systemd/raptor-wings.service {{.VM}}:/tmp/raptor-wings.service
      - limactl copy install/systemd/raptor-shutdown.service {{.VM}}:/tmp/raptor-shutdown.service
      - limactl copy "install/systemd/docker-.scope.d/10-raptor.conf" {{.VM}}:/tmp/raptor-scope.conf
      - limactl copy dev/wings/config.yml {{.VM}}:/tmp/raptor-config.yml
      - |
        limactl shell {{.VM}} sudo bash -euc '
          getent group raptor >/dev/null || groupadd --system raptor
          id raptor >/dev/null 2>&1 || useradd --system --gid raptor --no-create-home --shell /usr/sbin/nologin raptor
          install -m 0644 /tmp/raptor-wings.service /etc/systemd/system/raptor-wings.service
          install -m 0644 /tmp/raptor-shutdown.service /etc/systemd/system/raptor-shutdown.service
          install -D -m 0644 /tmp/raptor-scope.conf "/etc/systemd/system/docker-.scope.d/10-raptor.conf"
          install -d -m 0700 /etc/raptor
          install -m 0600 /tmp/raptor-config.yml /etc/raptor/config.yml
          # Server data volume with quotas, as on a real node (tier 2).
          if ! raptor storage status >/dev/null 2>&1; then
            v=/var/lib/raptor/volumes
            if [ -d $v ] && ! mountpoint -q $v && [ -n "$(ls -A $v)" ]; then
              mv $v $v.old-$(date +%s)
            fi
            raptor storage setup -size 4GiB
          fi
          systemctl daemon-reload
          systemctl enable raptor-wings raptor-shutdown >/dev/null 2>&1
          systemctl start raptor-shutdown
          systemctl restart raptor-wings
          sleep 1
          systemctl --no-pager --lines=5 status raptor-wings
        '

  e2e:conformance:
    desc: "Egg conformance suite in the Wings VM (TIER=fast|slow|manual|all, SET=certified|community|all, RUN=regex of catalog IDs)"
    vars:
      TIER: '{{.TIER | default "fast"}}'
      SET: '{{.SET | default "all"}}'
      RUN: '{{.RUN | default "."}}'
    cmds:
      - task: wings:vm:up
      - |
        set -eu
        ARCH=$(limactl shell {{.VM}} dpkg --print-architecture)
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/conformance-e2e-$ARCH ./internal/wings/conformance
        limactl copy bin/conformance-e2e-$ARCH {{.VM}}:/tmp/conformance-e2e
        limactl shell {{.VM}} sudo rm -f /tmp/conformance.md
        limactl shell {{.VM}} sudo RAPTOR_CONFORMANCE_TIER={{.TIER}} RAPTOR_CONFORMANCE_SET={{.SET}} RAPTOR_CONFORMANCE_REPORT=/tmp/conformance.md \
          /tmp/conformance-e2e -test.v -test.timeout 600m -test.run 'TestConformance/{{.RUN}}' || rc=$?
        limactl shell {{.VM}} cat /tmp/conformance.md 2>/dev/null || true
        exit ${rc:-0}

  e2e:pterodactyl:
    desc: "Behavioral diff against the real Pterodactyl Panel and Wings, in the Wings VM (RUN=regex of cases)"
    vars:
      RUN: '{{.RUN | default "."}}'
    cmds:
      - task: wings:vm:up
      - |
        set -eu
        ARCH=$(limactl shell {{.VM}} dpkg --print-architecture)
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/conformance-e2e-$ARCH ./internal/wings/conformance
        limactl copy bin/conformance-e2e-$ARCH {{.VM}}:/tmp/conformance-e2e
        limactl copy scripts/pterodactyl/setup.sh {{.VM}}:/tmp/pterodactyl-setup.sh
        limactl shell {{.VM}} rm -rf /tmp/diff-eggs
        limactl copy -r internal/wings/conformance/testdata {{.VM}}:/tmp/diff-eggs
        limactl shell {{.VM}} sh -c 'command -v jq >/dev/null || sudo apt-get install -y -qq jq >/dev/null'
        limactl shell {{.VM}} sudo sh -c 'bash /tmp/pterodactyl-setup.sh /tmp/diff-eggs/*.json'
        limactl shell {{.VM}} sudo /tmp/conformance-e2e -test.v -test.timeout 120m -test.run 'TestPterodactylDiff/{{.RUN}}'

  e2e:runtime:
    desc: "Test the runtime and server lifecycle in the Wings VM (RUN=regex selects tests)"
    vars:
      RUN: '{{.RUN | default "."}}'
    cmds:
      - task: wings:vm:up
      - |
        set -eu
        ARCH=$(limactl shell {{.VM}} dpkg --print-architecture)
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/docker-e2e-$ARCH ./internal/wings/docker
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/server-e2e-$ARCH ./internal/wings/server
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/actions-e2e-$ARCH ./internal/wings/actions
        limactl copy bin/docker-e2e-$ARCH {{.VM}}:/tmp/docker-e2e
        limactl copy bin/server-e2e-$ARCH {{.VM}}:/tmp/server-e2e
        limactl copy bin/actions-e2e-$ARCH {{.VM}}:/tmp/actions-e2e
        limactl shell {{.VM}} sudo /tmp/docker-e2e -test.v -test.timeout 20m -test.run 'TestRuntime.*{{.RUN}}'
        limactl shell {{.VM}} sudo /tmp/server-e2e -test.v -test.timeout 20m -test.run '{{.RUN}}'
        limactl shell {{.VM}} sudo /tmp/actions-e2e -test.v -test.timeout 20m -test.run '{{.RUN}}'

  e2e:quotas:
    desc: "Disk quota tests in the Wings VM: limits, the seccomp escape check, a real reboot, online growth"
    cmds:
      - task: wings:vm:up
      - |
        set -eu
        ARCH=$(limactl shell {{.VM}} dpkg --print-architecture)
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/storage-e2e-$ARCH ./internal/wings/storage
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/server-e2e-$ARCH ./internal/wings/server
        limactl shell {{.VM}} sudo mkdir -p /var/lib/raptor-e2e
        for f in storage-e2e server-e2e; do
          limactl copy bin/$f-$ARCH {{.VM}}:/tmp/$f
          limactl shell {{.VM}} sudo install -m 0755 /tmp/$f /var/lib/raptor-e2e/$f
        done
        limactl copy scripts/e2e-quotas.sh {{.VM}}:/tmp/e2e-quotas.sh
        limactl shell {{.VM}} sudo install -m 0755 /tmp/e2e-quotas.sh /var/lib/raptor-e2e/e2e-quotas.sh
        Q="sudo /var/lib/raptor-e2e/e2e-quotas.sh /var/lib/raptor-e2e/storage-e2e /var/lib/raptor-e2e/server-e2e"
        limactl shell {{.VM}} $Q fresh test
        limactl stop {{.VM}}
        limactl start --tty=false {{.VM}}
        limactl shell {{.VM}} $Q after-reboot grow

  e2e:host:
    desc: "Host-level lifecycle test in the Wings VM: Wings/Docker restarts, host shutdown, the CLI, reboot"
    cmds:
      - task: wings:vm:install
      - |
        set -eu
        ARCH=$(limactl shell {{.VM}} dpkg --print-architecture)
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/server-e2e-$ARCH ./internal/wings/server
        limactl copy bin/server-e2e-$ARCH {{.VM}}:/tmp/server-e2e
        limactl copy scripts/e2e-host.sh {{.VM}}:/tmp/e2e-host.sh
        limactl shell {{.VM}} sudo install -D -m 0755 /tmp/e2e-host.sh /var/lib/raptor-e2e/e2e-host.sh
        limactl shell {{.VM}} sudo /var/lib/raptor-e2e/e2e-host.sh seed
        limactl shell {{.VM}} sudo /var/lib/raptor-e2e/e2e-host.sh cli
        limactl stop {{.VM}}
        limactl start --tty=false {{.VM}}
        limactl shell {{.VM}} sudo /var/lib/raptor-e2e/e2e-host.sh after-reboot

  e2e:faults:
    desc: "Fault injection in a throwaway VM (FAULTS_VM, default raptor-faults): kills Wings and Docker, fills disks, unmounts the volume, corrupts state.db"
    vars:
      FVM: '{{.FAULTS_VM | default "raptor-faults"}}'
    cmds:
      # Its own VM, never the shared one: these faults are destructive.
      - task VM={{.FVM}} wings:vm:install
      - |
        set -eu
        ARCH=$(limactl shell {{.FVM}} dpkg --print-architecture)
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/server-e2e-$ARCH ./internal/wings/server
        limactl copy bin/server-e2e-$ARCH {{.FVM}}:/tmp/server-e2e
        limactl copy scripts/e2e-faults.sh {{.FVM}}:/tmp/e2e-faults.sh
        limactl shell {{.FVM}} sudo bash /tmp/e2e-faults.sh

  soak:start:
    desc: "Start the soak test in its own VM (SOAK_VM, default raptor-soak): servers with scheduled restarts and backups, random Wings restarts. Runs until soak:stop"
    vars:
      SVM: '{{.SOAK_VM | default "raptor-soak"}}'
    cmds:
      - task VM={{.SVM}} wings:vm:install
      - |
        set -eu
        ARCH=$(limactl shell {{.SVM}} dpkg --print-architecture)
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/actions-e2e-$ARCH ./internal/wings/actions
        limactl copy bin/actions-e2e-$ARCH {{.SVM}}:/tmp/actions-e2e
        limactl copy scripts/soak.sh {{.SVM}}:/tmp/soak.sh
        limactl shell {{.SVM}} sudo install -D -m 0755 /tmp/soak.sh /var/lib/raptor-soak/soak.sh
        limactl shell {{.SVM}} sudo env SOAK_SERVERS="{{.SOAK_SERVERS}}" SOAK_RESTART="{{.SOAK_RESTART}}" SOAK_BACKUP="{{.SOAK_BACKUP}}" SOAK_CHAOS_MIN="{{.SOAK_CHAOS_MIN}}" SOAK_CHAOS_MAX="{{.SOAK_CHAOS_MAX}}" /var/lib/raptor-soak/soak.sh start

  soak:report:
    desc: "How the soak test is going (fails on unexpected downtime)"
    cmds:
      - limactl shell {{.SOAK_VM | default "raptor-soak"}} sudo /var/lib/raptor-soak/soak.sh report

  soak:stop:
    desc: "Stop the soak test's chaos and monitor"
    cmds:
      - limactl shell {{.SOAK_VM | default "raptor-soak"}} sudo /var/lib/raptor-soak/soak.sh stop

  e2e:bootstrap:
    desc: "raptor bootstrap on a fresh VM (BOOT_VM, default raptor-boot; DISTRO: debian-12, debian-13, ubuntu-24.04): bootstrap, rerun, doctor, reboot. Needs task dev running"
    cmds:
      - scripts/e2e-bootstrap.sh {{.BOOT_VM | default "raptor-boot"}} {{.DISTRO | default "debian-12"}}

  gate:link:
    desc: "The node connection through Cloudflare (Phase 3.0 gate): a quick tunnel, then rpc, cut, transfer; ARGS='-idle 4h' holds it idle too (needs cloudflared)"
    cmds:
      - go run ./dev/linkgate {{.ARGS}}

  e2e:update:
    desc: "Self-update in the Wings VM: an update, rollbacks of a crashing and a hanging version, a restart during a trial"
    cmds:
      - task: wings:vm:install
      - |
        set -eu
        ARCH=$(limactl shell {{.VM}} dpkg --print-architecture)
        scripts/e2e-update-build.sh $ARCH bin/update-e2e
        tar --no-mac-metadata -C bin -czf bin/update-e2e.tgz update-e2e
        # Seeds a running server, which updates must leave alone.
        CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go test -c -tags e2e -o bin/server-e2e-$ARCH ./internal/wings/server
        limactl copy bin/server-e2e-$ARCH {{.VM}}:/tmp/server-e2e
        limactl copy bin/update-e2e.tgz {{.VM}}:/tmp/update-e2e.tgz
        limactl copy scripts/e2e-update.sh {{.VM}}:/tmp/e2e-update.sh
        limactl shell {{.VM}} sudo bash -euc 'rm -rf /tmp/update-e2e && tar -C /tmp -xzf /tmp/update-e2e.tgz'
        limactl shell {{.VM}} sudo bash /tmp/e2e-update.sh /tmp/update-e2e /tmp/server-e2e

  wings:vm:delete:
    desc: Delete the Wings VM
    cmds:
      - limactl delete --force {{.VM}}
