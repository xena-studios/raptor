# WAL archive and backups to object storage in another location
# (docs/DEPLOY.md). Credentials and the encryption passphrase come from the
# environment: PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET,
# PGBACKREST_REPO1_S3_BUCKET, PGBACKREST_REPO1_S3_ENDPOINT,
# PGBACKREST_REPO1_S3_REGION, PGBACKREST_REPO1_CIPHER_PASS.
[global]
repo1-type=s3
repo1-path=/raptor
repo1-s3-uri-style=path
# Encrypted before it leaves the server: the storage provider can't read it.
repo1-cipher-type=aes-256-cbc
# Four weekly full backups, with daily differentials between them.
repo1-retention-full=4
compress-type=zst
process-max=2
start-fast=y
log-level-console=info
log-level-file=off
archive-async=y
spool-path=/var/spool/pgbackrest

[raptor]
pg1-path=/var/lib/postgresql/18/docker
