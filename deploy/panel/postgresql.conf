# Postgres (docs/DEPLOY.md). Everything else is Postgres's default.
listen_addresses = '*'
max_connections = 200
# For 4 GB. compose.yaml overrides these three from .env on a bigger
# machine (production: PG_SHARED_BUFFERS and the others, docs/DEPLOY.md).
shared_buffers = 1GB
effective_cache_size = 3GB
maintenance_work_mem = 256MB
work_mem = 16MB
# SSD storage: a random read costs about what a sequential one does.
random_page_cost = 1.1
# The Panel's queries are short; compiling them costs more than it saves.
jit = off

# Which queries take the time (pg_stat_statements, created on the first
# start by initdb/30-extensions.sql; an existing server: docs/DEPLOY.md),
# and how much of it is waiting on the disk. Changing the preload needs a
# restart.
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on

# WAL to object storage (pgBackRest). "replica" is the WAL level archiving
# needs; there's no replica.
wal_level = replica
# A replication slot nothing reads (a replica gone for good) keeps WAL
# forever and fills the disk; past this much, Postgres drops what it holds.
max_slot_wal_keep_size = 2GB
archive_mode = on
archive_command = 'pgbackrest --stanza=raptor archive-push %p'
archive_timeout = 60   # at most a minute of writes only on this server (RELIABILITY.md: RPO)
# Full-page images after each checkpoint are most of the WAL; compressed,
# less to write and to send.
wal_compression = zstd

password_encryption = scram-sha-256
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500ms
