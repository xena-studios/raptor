# Postgres (docs/DEPLOY.md). Everything else is Postgres's default.
listen_addresses = '*'
max_connections = 200
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# WAL to object storage (pgBackRest). "replica" is the WAL level archiving
# needs; there's no replica.
wal_level = replica
# A replication slot nothing reads (a replica gone for good) keeps WAL
# forever and fills the disk; past this much, Postgres drops what it holds.
max_slot_wal_keep_size = 2GB
archive_mode = on
archive_command = 'pgbackrest --stanza=raptor archive-push %p'
archive_timeout = 60   # at most a minute of writes only on this server (RELIABILITY.md: RPO)
# Full-page images after each checkpoint are most of the WAL; compressed,
# less to write and to send.
wal_compression = zstd

password_encryption = scram-sha-256
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500ms
