# Postgres primary (docs/DEPLOY.md). Everything else is Postgres's default.
listen_addresses = '*'
max_connections = 200
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Replication to server #2, and WAL to object storage (pgBackRest).
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 2GB
hot_standby = on
archive_mode = on
archive_command = 'pgbackrest --stanza=raptor archive-push %p'
archive_timeout = 60   # at most a minute of data only on this server (RELIABILITY.md: RPO)

password_encryption = scram-sha-256
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500ms
