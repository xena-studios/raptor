source:
  repo: xena-studios/raptor
  path: library/software/mosquitto/egg-mosquitto.json
license: MIT
credits:
  - "Written for Raptor from Mosquitto's documentation, https://mosquitto.org (EPL-2.0 or EDL-1.0); the broker is Debian 13's package"
  - "Icon: the Mosquitto logo, from https://github.com/eclipse-mosquitto/mosquitto (EPL-2.0)"
certified: true
arch: [amd64, arm64]
test:
  tier: fast
  memory_mib: 128
  done_timeout: 2m
  variables:
    MQTT_USERNAME: "raptor"
    MQTT_PASSWORD: "raptor-test-pw"
  config:
    mosquitto.conf: "listener {{port}}"
