source:
  repo: xena-studios/raptor
  path: library/software/ntfy/egg-ntfy.json
license: MIT
credits:
  - "Written for Raptor from ntfy's documentation, https://docs.ntfy.sh (Apache-2.0/GPL-2.0); no upstream egg"
  - "Icon: the ntfy app icon, from https://github.com/binwiederhier/ntfy (web/public/static/images)"
certified: true
arch: [amd64, arm64]
test:
  tier: fast
  memory_mib: 256
  done_timeout: 2m
  # Exercises the admin login, which hashes the password at start.
  variables:
    ADMIN_PASSWORD: "raptor-test"
    NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
