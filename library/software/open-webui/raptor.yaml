source:
  repo: xena-studios/raptor
  path: library/software/open-webui/egg-open-webui.json
license: MIT
credits:
  - "Written for Raptor from Open WebUI's documentation and Dockerfile (https://github.com/open-webui/open-webui, Open WebUI License)"
  - "Icon: the Open WebUI logo, from https://github.com/open-webui (Open WebUI)"
certified: true
arch: [amd64, arm64]
# The first start installs Open WebUI and PyTorch for the CPU (about 2 GB),
# then downloads its embedding model; later starts take seconds.
test:
  tier: fast
  memory_mib: 3072
  done_timeout: 20m
