source:
  repo: xena-studios/raptor
  path: library/software/synapse/egg-synapse.json
license: MIT
credits:
  - "Written for Raptor from Synapse's documentation, https://github.com/element-hq/synapse (AGPL-3.0); no upstream egg"
  - "Icon: the Matrix logo, from https://github.com/matrix-org"
certified: true
arch: [amd64, arm64]
test:
  tier: fast
  memory_mib: 1024
  # The first start installs Synapse from PyPI.
  done_timeout: 10m
  variables:
    SYNAPSE_SERVER_NAME: "matrix.raptor.test"
    ADMIN_PASSWORD: "raptor-test-admin"
