source:
  repo: xena-studios/raptor
  path: library/steam/css/egg-css.json
license: MIT
credits:
  - "Based on the Counter-Strike: Source eggs in https://github.com/pterodactyl/game-eggs and https://github.com/pelican-eggs/games-steamcmd (MIT)"
  - "Icon: Counter-Strike: Source's icon, from Steam (Valve)"
certified: true
arch: [amd64]
players:
  query: source
# The Players tab talks to the game over RCON, on its game port; RCON is
# off until a password is set.
rcon:
  protocol: source
  password: RCON_PASSWORD
  players: source
test:
  tier: slow
  memory_mib: 2048
  done_timeout: 30m
  command: "status"
  expect: "hostname"
