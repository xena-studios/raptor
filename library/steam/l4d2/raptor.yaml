source:
  repo: xena-studios/raptor
  path: library/steam/l4d2/egg-l4d2.json
license: MIT
credits:
  - "Based on the Left 4 Dead 2 egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Left 4 Dead 2's logo, from its Steam store page (Valve)"
certified: true
arch: [amd64]
players:
  query: source
# The Players tab talks to the game over RCON, on its game port; RCON is
# off until a password is set.
rcon:
  protocol: source
  password: RCON_PASSWORD
  players: source
test:
  tier: slow
  memory_mib: 2048
  done_timeout: 30m
  command: "status"
  expect: "hostname"
