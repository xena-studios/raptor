source:
  repo: xena-studios/raptor
  path: library/steam/enshrouded/egg-enshrouded.json
license: MIT
credits:
  - "Based on the Enshrouded egg in https://github.com/pterodactyl/game-eggs (MIT) and https://github.com/pelican-eggs/games-steamcmd (MIT)"
  - "Icon: Enshrouded's icon, from Steam (Keen Games)"
certified: true
arch: [amd64]
# Enshrouded answers Steam's query on its one port.
players:
  query: source
# No backup hooks: Enshrouded has no console; it saves on its own.
test:
  tier: slow
  memory_mib: 8192
  variables:
    SRV_PW: "conformance-admin"
    SRV_PW2: "conformance-friend"
  done_timeout: 60m
