source:
  repo: xena-studios/raptor
  path: library/steam/hl2dm/egg-hl2dm.json
license: MIT
credits:
  - "Based on the Half-Life 2: Deathmatch egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Half-Life 2: Deathmatch's icon, from Steam (Valve)"
certified: true
arch: [amd64]
players:
  query: source
# The Players tab talks to the game over RCON, on its game port; RCON is
# off until a password is set.
rcon:
  protocol: source
  password: RCON_PASSWORD
  players: source
test:
  tier: slow
  memory_mib: 2048
  done_timeout: 30m
  command: "status"
  expect: "hostname"
