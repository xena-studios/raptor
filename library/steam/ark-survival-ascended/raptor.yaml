source:
  repo: xena-studios/raptor
  path: library/steam/ark-survival-ascended/egg-ark-survival-ascended.json
license: MIT
credits:
  - "Based on the ARK: Survival Ascended egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: ARK: Survival Ascended's logo, from its Steam store page (Studio Wildcard)"
certified: true
arch: [amd64]
# The console reaches the game over RCON. ARK can't pause saving, so a backup
# saves first and has nothing to undo. RCON answers SaveWorld "World Saved"
# while files may still be written; the game log's "World Save Complete.
# Took: ..." (tailed into the console) comes once they are.
backup:
  pre: ["SaveWorld"]
  wait_for: "World Save Complete"
  timeout: 10m
# No player count: ARK: Survival Ascended lists through Epic, not Steam's query.
test:
  tier: slow
  memory_mib: 12288
  variables:
    ARK_ADMIN_PASSWORD: "conformance"
    BATTLE_EYE: "0"
  done_timeout: 60m
  command: "ListPlayers"
  expect: "No Players Connected"
