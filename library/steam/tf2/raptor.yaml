source:
  repo: xena-studios/raptor
  path: library/steam/tf2/egg-tf2.json
license: MIT
credits:
  - "Based on the Team Fortress 2 egg in https://github.com/pelican-eggs/games-steamcmd (MIT) and https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Team Fortress 2's icon, from Steam (Valve)"
certified: true
arch: [amd64]
players:
  query: source
# The Players tab talks to the game over RCON, on its game port; RCON is
# off until a password is set.
rcon:
  protocol: source
  password: RCON_PASSWORD
  players: source
test:
  tier: manual
  reason: "the server is about 15 GB, more than standard CI runners have room for"
  memory_mib: 2048
  done_timeout: 30m
  command: "status"
  expect: "hostname"
