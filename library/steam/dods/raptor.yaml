source:
  repo: xena-studios/raptor
  path: library/steam/dods/egg-dods.json
license: MIT
credits:
  - "Written for Raptor from Day of Defeat: Source's own server documentation, on the pattern of Raptor's Source eggs"
  - "Icon: Day of Defeat: Source's icon, from Steam (Valve)"
certified: true
arch: [amd64]
# Source servers answer Steam's query on their game port.
players:
  query: source
# The Players tab talks to the game over RCON, on its game port; RCON is
# off until a password is set.
rcon:
  protocol: source
  password: RCON_PASSWORD
  players: source
test:
  tier: slow
  memory_mib: 2048
  done_timeout: 30m
  command: "status"
  expect: "hostname"
