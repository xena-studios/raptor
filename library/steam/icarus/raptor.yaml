source:
  repo: xena-studios/raptor
  path: library/steam/icarus/egg-icarus.json
license: MIT
credits:
  - "Based on the Icarus eggs in https://github.com/pterodactyl/game-eggs and https://github.com/pelican-eggs/games-steamcmd (MIT)"
  - "Icon: Icarus's logo, from its Steam store page (RocketWerkz)"
certified: true
arch: [amd64]
players:
  query: source
  port: QUERY_PORT
# No backup hooks: the console runs under Wine without input; Icarus saves
# prospects on its own and when stopped.
test:
  tier: slow
  memory_mib: 8192
  variables:
    ADMIN_PASSWORD: "conformance"
  done_timeout: 60m
