source:
  repo: xena-studios/raptor
  path: library/steam/project-zomboid/egg-project-zomboid.json
license: MIT
credits:
  - "Based on the Project Zomboid egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Project Zomboid's icon, from Steam (The Indie Stone)"
certified: true
arch: [amd64]
# No backup hooks: "save" saves, but the game can't pause saving, and hooks
# without a post command aren't allowed yet.
test:
  tier: slow
  memory_mib: 6144
  variables:
    ADMIN_PASSWORD: "conformance"
  done_timeout: 40m
  command: "players"
  expect: "Players connected"
