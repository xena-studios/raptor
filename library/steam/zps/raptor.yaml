source:
  repo: xena-studios/raptor
  path: library/steam/zps/egg-zps.json
license: MIT
credits:
  - "Written for Raptor from Zombie Panic! Source's own server documentation, on the pattern of Raptor's Source eggs"
  - "Icon: Zombie Panic! Source's logo, from its Steam store page (Zombie Panic! Team)"
certified: true
arch: [amd64]
# Source servers answer Steam's query on their game port.
players:
  query: source
# The Players tab talks to the game over RCON, on its game port; RCON is
# off until a password is set.
rcon:
  protocol: source
  password: RCON_PASSWORD
  players: source
test:
  tier: slow
  memory_mib: 2048
  done_timeout: 40m
  command: "status"
  expect: "hostname"
