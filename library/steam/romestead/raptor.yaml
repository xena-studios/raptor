source:
  repo: xena-studios/raptor
  path: library/steam/romestead/egg-romestead.json
license: MIT
credits:
  - "Based on the Romestead egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Romestead's logo, from its Steam store page (Beartwigs)"
certified: true
arch: [amd64]
# No player count: the server answers no known query. Romestead can't pause
# saving, so a backup saves first and has nothing to undo.
backup:
  pre: ["save"]
  wait_for: "HostServer_WorldSaved"
  timeout: 5m
test:
  tier: slow
  memory_mib: 6144
  done_timeout: 20m
