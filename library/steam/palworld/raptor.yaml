source:
  repo: xena-studios/raptor
  path: library/steam/palworld/egg-palworld.json
license: MIT
credits:
  - "Based on the Palworld eggs in https://github.com/pelican-eggs/games-steamcmd and https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Palworld's logo, from its Steam store page (Pocketpair)"
certified: true
arch: [amd64]
# No player count: Palworld doesn't answer Steam's server query.
# Palworld can't pause saving, so a backup saves first and has nothing to undo.
backup:
  pre: ["Save"]
  wait_for: "Complete Save"
  timeout: 5m
# The Players tab talks to the game over RCON with the admin password.
rcon:
  protocol: source
  port: RCON_PORT
  password: ADMIN_PASSWORD
  players: palworld
test:
  tier: slow
  memory_mib: 12288
  variables:
    ADMIN_PASSWORD: "conformance"
    SERVER_NAME: "raptor-conformance"
  done_timeout: 30m
  command: "Info"
  expect: "Welcome to Pal Server"
