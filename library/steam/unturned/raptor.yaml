source:
  repo: xena-studios/raptor
  path: library/steam/unturned/egg-unturned.json
license: MIT
credits:
  - "Based on the Unturned egg in https://github.com/pelican-eggs/games-steamcmd (MIT) and https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Unturned's logo, from its Steam store page (Smartly Dressed Games)"
certified: true
arch: [amd64]
# Unturned can't pause saving, so a backup saves first and has nothing to undo.
backup:
  pre: ["save"]
  wait_for: "Successfully saved the game"
  timeout: 5m
test:
  tier: slow
  memory_mib: 3072
  done_timeout: 20m
