source:
  repo: xena-studios/raptor
  path: library/steam/unturned/egg-unturned.json
license: MIT
credits:
  - "Based on the Unturned egg in https://github.com/pelican-eggs/games-steamcmd (MIT) and https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Unturned's logo, from its Steam store page (Smartly Dressed Games)"
certified: true
arch: [amd64]
# OpenMod's plugins from NuGet (#415). They load from the server's folder
# in Servers/, which is Servers/Raptor (SRV_ID can't be changed by users).
# RocketMod's plugins have no registry with hashes, so they aren't offered.
addons:
  openmod:
    loaders: [openmod]
    dir: Servers/Raptor/OpenMod/plugins
# Unturned can't pause saving, so a backup saves first and has nothing to undo.
backup:
  pre: ["save"]
  wait_for: "Successfully saved the game"
  timeout: 5m
test:
  tier: slow
  memory_mib: 3072
  done_timeout: 20m
