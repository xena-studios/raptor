source:
  repo: xena-studios/raptor
  path: library/steam/sourcecoop/egg-sourcecoop.json
license: MIT
credits:
  - "Based on the SourceCoop egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Black Mesa's icon, from Steam (Crowbar Collective)"
certified: true
arch: [amd64]
players:
  query: source
test:
  tier: manual
  reason: "Black Mesa's server is about 30 GB, more than standard CI runners have room for"
  memory_mib: 2048
  done_timeout: 60m
  command: "sm plugins list"
  expect: "SourceCoop"
