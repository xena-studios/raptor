source:
  repo: xena-studios/raptor
  path: library/minecraft/spongevanilla/egg-spongevanilla.json
license: MIT
credits:
  - "Based on the Sponge eggs in https://github.com/pelican-eggs/minecraft and https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: SpongePowered's logo, from https://github.com/SpongePowered"
certified: true
arch: [amd64, arm64]
players:
  query: minecraft
test:
  tier: fast
  memory_mib: 2048
  eula: true
  done_timeout: 5m
  command: "list"
  expect: "There are 0 of a max of \\d+ players"
# Sponge loads its plugins from mods/.
addons:
  plugins:
    loaders: [sponge]
    dir: mods
    version: MINECRAFT_VERSION
  datapacks:
    loaders: [datapack]
    dir: world/datapacks
    version: MINECRAFT_VERSION
# save-off and everything written out before the snapshot, so it never
# catches region files mid-write; save-on after, even if the backup fails.
backup:
  pre: ["save-off", "save-all flush"]
  post: ["save-on"]
  wait_for: "regex:Saved the (game|world)" # 1.13+ says game, older world
  timeout: 5m
