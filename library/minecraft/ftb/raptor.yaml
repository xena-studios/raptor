source:
  repo: xena-studios/raptor
  path: library/minecraft/ftb/egg-ftb.json
license: MIT
credits:
  - "Based on the FTB egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: Feed The Beast's logo, the avatar of https://github.com/FTBTeam"
certified: true
arch: [amd64, arm64]
players:
  query: minecraft
test:
  tier: slow
  # FTB Unstable 1.20: Forge, one of FTB's smaller packs (about 300 MB).
  memory_mib: 4096
  eula: true
  variables:
    FTB_MODPACK_ID: "110"
  done_timeout: 15m
  command: "list"
  expect: "There are 0 of a max of \\d+ players"
addons:
  datapacks:
    loaders: [datapack]
    dir: world/datapacks
# save-off and everything written out before the snapshot, so it never
# catches region files mid-write; save-on after, even if the backup fails.
backup:
  pre: ["save-off", "save-all flush"]
  post: ["save-on"]
  wait_for: "regex:Saved the (game|world)" # 1.13+ says game, older world
  timeout: 5m
