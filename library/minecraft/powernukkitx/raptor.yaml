source:
  repo: xena-studios/raptor
  path: library/minecraft/powernukkitx/egg-powernukkitx.json
license: MIT
credits:
  - "Based on the PowerNukkitX egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: PowerNukkitX's logo, from https://github.com/PowerNukkitX"
certified: true
arch: [amd64, arm64]
backup:
