source:
  repo: xena-studios/raptor
  path: library/minecraft/spigot/egg-spigot.json
license: MIT
credits:
  - "Based on the Spigot egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: SpigotMC's logo, from https://github.com/SpigotMC"
certified: true
arch: [amd64, arm64]
players:
  query: minecraft
test:
  # The install builds Spigot with BuildTools: about five minutes.
  tier: slow
  memory_mib: 2560
  eula: true
  done_timeout: 5m
  command: "list"
  expect: "There are 0 of a max of \\d+ players"
addons:
  plugins:
    loaders: [spigot, bukkit]
    dir: plugins
    version: DL_VERSION
  datapacks:
    loaders: [datapack]
    dir: world/datapacks
    version: DL_VERSION
# save-off and everything written out before the snapshot, so it never
# catches region files mid-write; save-on after, even if the backup fails.
backup:
  pre: ["save-off", "save-all flush"]
  post: ["save-on"]
  wait_for: "regex:Saved the (game|world)" # 1.13+ says game, older world
  timeout: 5m
