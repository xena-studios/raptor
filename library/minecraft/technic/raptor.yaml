source:
  repo: xena-studios/raptor
  path: library/minecraft/technic/egg-technic.json
license: MIT
credits:
  - "Raptor's own, after its FTB and CurseForge eggs; installs Technic's official server downloads"
  - "Icon: Technic's logo, the avatar of https://github.com/TechnicPack"
certified: true
arch: [amd64, arm64]
# Minecraft 1.7 and newer answer the status ping; older packs (Tekkit
# Classic, Hexxit) only the legacy one, so their player count is empty.
players:
  query: minecraft
test:
  tier: slow
  # Tekkit 2: Forge 1.12.2, about 200 MB, on Java 8 (the egg's first
  # image; Forge for 1.12.2 runs on nothing newer). Older packs don't
  # answer the status ping the players step uses.
  memory_mib: 4096
  eula: true
  variables:
    TECHNIC_PACK: "tekkit-2"
    TECHNIC_VERSION: "1.2.6"
  done_timeout: 15m
  command: "list"
  expect: "There are 0 of a max of \\d+ players|There are 0/\\d+ players"
# Technic packs are fixed sets of mods, so no mod add-ons. save-off and
# everything written out before the snapshot, so it never catches region
# files mid-write; save-on after, even if the backup fails.
backup:
  pre: ["save-off", "save-all flush"]
  post: ["save-on"]
  wait_for: "regex:Saved the (game|world)|Save complete" # 1.13+ game, older world, 1.2 Save complete
  timeout: 5m
