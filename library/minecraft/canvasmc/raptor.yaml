source:
  repo: xena-studios/raptor
  path: library/minecraft/canvasmc/egg-canvasmc.json
license: MIT
credits:
  - "Based on the CanvasMC egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: CanvasMC's logo, from https://github.com/CraftCanvasMC"
certified: true
arch: [amd64, arm64]
players:
  query: minecraft
test:
  tier: manual
  reason: "canvasmc.io's API (behind Cloudflare) refuses GitHub's runners"
  memory_mib: 2048
  eula: true
  done_timeout: 5m
  command: "list"
  expect: "There are 0 of a max of \\d+ players"
addons:
  plugins:
    loaders: [folia]
    dir: plugins
    version: MC_VERSION
  datapacks:
    loaders: [datapack]
    dir: world/datapacks
    version: MC_VERSION
# save-off and everything written out before the snapshot, so it never
# catches region files mid-write; save-on after, even if the backup fails.
backup:
  pre: ["save-off", "save-all flush"]
  post: ["save-on"]
  wait_for: "regex:Saved the (game|world)" # 1.13+ says game, older world
  timeout: 5m
