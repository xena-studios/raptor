source:
  repo: xena-studios/raptor
  path: library/minecraft/spongeforge/egg-spongeforge.json
license: MIT
credits:
  - "Based on the SpongeForge egg in https://github.com/pterodactyl/game-eggs and the Sponge egg in https://github.com/pelican-eggs/minecraft (MIT)"
  - "Icon: SpongePowered's logo, from https://github.com/SpongePowered"
certified: true
arch: [amd64, arm64]
players:
  query: minecraft
test:
  tier: fast
  memory_mib: 3072
  eula: true
  done_timeout: 10m
  command: "list"
  expect: "There are 0 of a max of \\d+ players"
# Sponge's plugins and the loader's mods both go in mods/.
addons:
  plugins:
    loaders: [sponge]
    dir: mods
    version: SF_MC_VERSION
  mods:
    loaders: [forge, neoforge]
    dir: mods
    version: SF_MC_VERSION
  datapacks:
    loaders: [datapack]
    dir: world/datapacks
    version: SF_MC_VERSION
# save-off and everything written out before the snapshot, so it never
# catches region files mid-write; save-on after, even if the backup fails.
backup:
  pre: ["save-off", "save-all flush"]
  post: ["save-on"]
  wait_for: "regex:Saved the (game|world)" # 1.13+ says game, older world
  timeout: 5m
