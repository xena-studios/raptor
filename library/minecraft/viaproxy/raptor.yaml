source:
  repo: xena-studios/raptor
  path: library/minecraft/viaproxy/egg-viaproxy.json
license: MIT
credits:
  - "Based on the ViaProxy egg in https://github.com/pelican-eggs/minecraft (MIT)"
  - "Icon: ViaVersion's logo, the avatar of https://github.com/ViaVersion"
certified: true
arch: [amd64, arm64]
# No players query: ViaProxy relays its backend's status, so the count is the
# backend's, and with no backend it answers 0 of 0.
test:
  tier: fast
  memory_mib: 1024
  done_timeout: 3m
  command: "help"
  expect: "stop \\(Stop ViaProxy\\)"
