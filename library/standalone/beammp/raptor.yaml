source:
  repo: xena-studios/raptor
  path: library/standalone/beammp/egg-beammp.json
license: MIT
credits:
  - "Based on the BeamMP Servers egg in https://github.com/pterodactyl/game-eggs (MIT)"
  - "Icon: BeamMP's logo, the favicon of https://beammp.com"
certified: true
arch: [amd64, arm64]
# BeamMP saves nothing to back up mid-game: no backup hooks.
test:
  tier: fast
  memory_mib: 512
  variables:
    # Any key starts a private server; BeamMP's backend only checks it to
    # list a public one.
    AUTHKEY: "00000000-0000-0000-0000-000000000000"
    PRIVATE: "true"
  done_timeout: 3m
  command: "status"
  expect: "Connected Players:\\s+0"
