source:
  repo: xena-studios/raptor
  path: library/generic/deno/egg-deno.json
license: MIT
credits:
  - "Based on the Deno egg in https://github.com/pterodactyl/generic-eggs (deno/egg-deno-generic.json, MIT)"
  - "Icon: Deno's logo, the https://github.com/denoland avatar (Deno Land)"
certified: true
arch: [amd64, arm64]
test:
  tier: fast
  memory_mib: 256
  files:
    main.ts: |
      // Stands in for a bot: says it's ready, then echoes the console.
      import { TextLineStream } from "jsr:@std/streams@1/text-line-stream";
      console.log("ready");
      const lines = Deno.stdin.readable.pipeThrough(new TextDecoderStream()).pipeThrough(new TextLineStream());
      for await (const l of lines) if (l.trim()) console.log("got: " + l.trim());
  done_timeout: 3m
  ready: "^ready$"
  command: "hello"
  expect: "^got: hello$"
