# Raptor's own test egg: not a game, but the quickest check that a node
# installs, starts, reaches, talks to, and stops a server. Internal: the
# Panel seeds it for staff and the conformance suite, but orgs don't see
# it in their library. Part of Raptor, so AGPL like the rest of it.
source:
  repo: xena-studios/raptor
  path: library/generic/raptor-test/egg-raptor-test.json
license: AGPL-3.0
credits:
  - "Raptor's own, with its own icon (AGPL-3.0)"
certified: true
internal: true
arch: [amd64, arm64]
test:
  tier: fast
  memory_mib: 128
  done_timeout: 3m
  command: "status"
  expect: "^ok: \\d+ requests? served$"
