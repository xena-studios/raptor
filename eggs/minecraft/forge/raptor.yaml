# Catalog entry for the egg in this directory, an unmodified copy of
# https://github.com/pelican-eggs/minecraft/blob/75bf05d/java/forge/egg-forge-minecraft.yaml
source:
  repo: pelican-eggs/minecraft
  commit: 75bf05db3c6c305e0fa6eef1d38c7e7176121de9
  path: java/forge/egg-forge-minecraft.yaml
license: MIT
certified: true
arch: [amd64, arm64]
players:
  query: minecraft
test:
  tier: fast
  memory_mib: 2048
  # The egg's install script can't install Forge for Minecraft 26.x (it
  # looks for the old installer output name), so "latest" fails upstream;
  # pinned to the last 1.x release, the most used for modpacks.
  variables:
    MC_VERSION: "1.21.10"
  eula: true
  done_timeout: 10m
  command: "list"
  expect: "There are 0 of a max of \\d+ players"
addons:
  mods:
    loaders: [forge]
    dir: mods
    version: MC_VERSION
  datapacks:
    loaders: [datapack]
    dir: world/datapacks
    version: MC_VERSION
# save-off and everything written out before the snapshot, so it never
# catches region files mid-write; save-on after, even if the backup fails.
backup:
  pre: ["save-off", "save-all flush"]
  post: ["save-on"]
  wait_for: "regex:Saved the (game|world)" # 1.13+ says game, older world
  timeout: 5m
