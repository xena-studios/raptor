# Catalog entry for the egg in this directory, an unmodified copy of
# https://github.com/pelican-eggs/minecraft/blob/75bf05d/java/modrinth/egg-modrinth-generic.json
source:
  repo: pelican-eggs/minecraft
  commit: 75bf05db3c6c305e0fa6eef1d38c7e7176121de9
  path: java/modrinth/egg-modrinth-generic.json
license: MIT
certified: false
arch: [amd64, arm64]
players:
  query: minecraft
test:
  tier: fast
  # The egg defaults to Java 8; the pack is for Minecraft 1.21.1 (Java 21).
  image: ghcr.io/pelican-eggs/yolks:java_21
  memory_mib: 2048
  eula: true
  # Adrenaserver: a small server-side performance pack (Fabric).
  variables:
    PROJECT_ID: "H9OFWiay"
  done_timeout: 5m
  command: "list"
  expect: "There are 0 of a max of \\d+ players"
# save-off and everything written out before the snapshot, so it never
# catches region files mid-write; save-on after, even if the backup fails.
backup:
  pre: ["save-off", "save-all flush"]
  post: ["save-on"]
  wait_for: "regex:Saved the (game|world)" # 1.13+ says game, older world
  timeout: 5m
