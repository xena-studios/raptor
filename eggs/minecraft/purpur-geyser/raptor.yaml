# Catalog entry for the egg in this directory, an unmodified copy of
# https://github.com/pelican-eggs/minecraft/blob/75bf05d/crossplay/purpur-geysermc-floodgate/egg-purpur--geyser--floodgate.json
source:
  repo: pelican-eggs/minecraft
  commit: 75bf05db3c6c305e0fa6eef1d38c7e7176121de9
  path: crossplay/purpur-geysermc-floodgate/egg-purpur--geyser--floodgate.json
license: MIT
certified: false
arch: [amd64, arm64]
players:
  query: minecraft
test:
  tier: fast
  # The egg defaults to Java 8; current Minecraft needs Java 25.
  image: ghcr.io/pelican-eggs/yolks:java_25
  memory_mib: 2048
  eula: true
  done_timeout: 5m
  command: "list"
  expect: "There are 0 of a max of \\d+ players"
addons:
  plugins:
    loaders: [purpur, paper, spigot, bukkit]
    dir: plugins
    version: MINECRAFT_VERSION
  datapacks:
    loaders: [datapack]
    dir: world/datapacks
    version: MINECRAFT_VERSION
# save-off and everything written out before the snapshot, so it never
# catches region files mid-write; save-on after, even if the backup fails.
backup:
  pre: ["save-off", "save-all flush"]
  post: ["save-on"]
  wait_for: "regex:Saved the (game|world)" # 1.13+ says game, older world
  timeout: 5m
