version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
# A removed field's number must be reserved, so it's never reused for
# something else. raptor.panel.v1 is the Panel's API for its own web app,
# which ships with it, so calls and messages the app no longer uses can be
# removed there; the node and Wings APIs keep them, since nodes update on
# their own schedule (docs/DECISIONS.md #252).
breaking:
  use:
    - FILE
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
  except:
    - FIELD_NO_DELETE
  ignore_only:
    SERVICE_NO_DELETE: [proto/raptor/panel]
    RPC_NO_DELETE: [proto/raptor/panel]
    MESSAGE_NO_DELETE: [proto/raptor/panel]
