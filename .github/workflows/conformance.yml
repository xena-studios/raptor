name: Egg conformance

# Runs the egg library's eggs (library/) through the full Wings lifecycle
# with their unmodified images (internal/wings/conformance). Tiers
# (library/*/*/raptor.yaml):
#   fast: nightly and on demand, the whole tier, on amd64 and arm64
#   slow: big SteamCMD games, weekly and on demand; amd64 only (the games are)
#   manual: can't run on standard runners (see each egg's test.reason)
# A PR that touches eggs or the code that runs them runs Raptor's test
# server (generic/raptor-test) and the library eggs it changes, whatever
# their tier but manual, on both CPUs. Every library egg is certified, so
# every run must pass. Pushing a branch named conformance/* runs fast and
# slow.
on:
  push:
    branches: ["conformance/**"]
  pull_request:
    paths:
      - library/**
      - internal/eggs/**
      - internal/wings/containers/**
      - internal/wings/docker/**
      - internal/wings/install/**
      - internal/wings/server/**
      - internal/wings/conformance/**
      - .github/workflows/conformance.yml
  schedule:
    - cron: "17 4 * * *" # fast, nightly
    - cron: "43 5 * * 0" # slow, weekly
  workflow_dispatch:
    inputs:
      tier:
        description: Tier
        type: choice
        options: [fast, slow, all]
        default: fast
      run:
        description: Library IDs to run (regex)
        default: "."

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}-${{ github.event.schedule || inputs.tier || 'fast' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    if: >-
      github.event_name == 'push' || github.event.schedule == '17 4 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'slow')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        shard: [0/4, 1/4, 2/4, 3/4]
    name: fast ${{ matrix.shard }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nftables
        run: command -v nft || (sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables)
      - name: Build the harness
        run: go test -c -tags e2e -o /tmp/conformance-e2e ./internal/wings/conformance
      - name: Run eggs
        run: |
          sudo RAPTOR_CONFORMANCE_TIER=fast RAPTOR_CONFORMANCE_PRUNE=1 RAPTOR_CONFORMANCE_SHARD=${{ matrix.shard }} \
            RAPTOR_CONFORMANCE_REPORT="$GITHUB_STEP_SUMMARY" \
            /tmp/conformance-e2e -test.v -test.timeout 170m -test.run 'TestConformance/${{ inputs.run || '.' }}'

  # Raptor against the real Pterodactyl Panel and Wings
  # (docs/EGGS.md#behavioral-diff-against-pterodactyl). Blocking: an
  # unexplained difference is a compatibility bug.
  pterodactyl-diff:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      github.event.schedule == '17 4 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'slow')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nftables
        run: command -v nft || (sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables)
      - name: Build the harness
        run: go test -c -tags e2e -o /tmp/conformance-e2e ./internal/wings/conformance
      - name: Start Pterodactyl
        run: sudo bash scripts/pterodactyl/setup.sh internal/wings/conformance/testdata/*.json
      - name: Compare
        run: sudo /tmp/conformance-e2e -test.v -test.timeout 50m -test.run 'TestPterodactylDiff|TestPterodactylImport'
        working-directory: internal/wings/conformance

  slow:
    if: >-
      github.event_name == 'push' ||
      github.event.schedule == '43 5 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast')
    strategy:
      fail-fast: false
      matrix:
        shard: [0/4, 1/4, 2/4, 3/4]
    name: slow ${{ matrix.shard }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nftables
        run: command -v nft || (sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables)
      - name: Build the harness
        run: go test -c -tags e2e -o /tmp/conformance-e2e ./internal/wings/conformance
      - name: Run eggs
        run: |
          sudo RAPTOR_CONFORMANCE_TIER=slow RAPTOR_CONFORMANCE_SHARD=${{ matrix.shard }} RAPTOR_CONFORMANCE_PRUNE=1 \
            RAPTOR_CONFORMANCE_REPORT="$GITHUB_STEP_SUMMARY" \
            /tmp/conformance-e2e -test.v -test.timeout 350m -test.run 'TestConformance/${{ inputs.run || '.' }}'

  # A PR's changed library eggs, whatever their tier, and Raptor's test
  # server, the quickest check that Wings still runs eggs, on both CPUs
  # (eggs for one CPU are skipped on the other).
  library-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: ids
        run: |
          ids=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- library/ |
            awk -F/ 'NF >= 4 { print $2 "/" $3 }' | sort -u |
            while read -r id; do if [ -f "library/$id/raptor.yaml" ]; then echo "$id"; fi; done |
            { echo generic/raptor-test; cat; } | sort -u | paste -sd' ' -)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Eggs to run: $ids"

  library-pr:
    needs: library-changes
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    name: test server and changed eggs (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install nftables
        run: command -v nft || (sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables)
      - name: Build the harness
        run: go test -c -tags e2e -o /tmp/conformance-e2e ./internal/wings/conformance
      - name: Run eggs
        env:
          IDS: ${{ needs.library-changes.outputs.ids }}
        run: |
          sudo RAPTOR_CONFORMANCE_IDS="$IDS" RAPTOR_CONFORMANCE_PRUNE=1 \
            RAPTOR_CONFORMANCE_REPORT="$GITHUB_STEP_SUMMARY" \
            /tmp/conformance-e2e -test.v -test.timeout 350m -test.run 'TestConformance'
