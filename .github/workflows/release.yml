name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Produces a DRAFT release with binaries and checksums.txt.
      # The draft is signed and published locally with the offline key: task release:sign TAG=vX.Y.Z
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Panel's images for the servers (docs/DEPLOY.md), tagged with the
  # release. Deploys name the tag: deploy/scripts/deploy.sh vX.Y.Z.
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/panel.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/xena-studios/raptor-panel:${{ github.ref_name }}
            ghcr.io/xena-studios/raptor-panel:latest
      - uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/images/postgres.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xena-studios/raptor-postgres:18-${{ github.ref_name }}
            ghcr.io/xena-studios/raptor-postgres:18

  # Stable releases (vX.Y.Z, not -rc and the like) deploy themselves: the
  # Panel to server #1, then the web app (docs/DEPLOY.md#automatic-deploys).
  # Off until the repository variable DEPLOY_ENABLED is "true". The SSH key
  # can only run deploy-from-ci.sh, which checks the tag is on main.
  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Panel (server #1)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ github.ref_name }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$HOST" "$TAG"

  # After the Panel: the API stays compatible with the web app before it,
  # not after it.
  web:
    needs: deploy
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production-web
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - name: Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: web
        run: |
          pnpm dlx wrangler@4 deploy --message "$GITHUB_REF_NAME ($GITHUB_SHA)"
          pnpm dlx wrangler@4 deploy -c wrangler.verify.jsonc --message "$GITHUB_REF_NAME ($GITHUB_SHA)"
