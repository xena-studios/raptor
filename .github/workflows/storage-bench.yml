name: Storage benchmark

# The disk quota validation benchmark (scripts/storage-bench.sh) on a real
# Linux disk: native filesystem vs the XFS loop volume. On demand, or when a
# branch named bench/* is pushed.
on:
  workflow_dispatch:
  push:
    branches: ["bench/**"]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Benchmark
        run: sudo RUNS=5 scripts/storage-bench.sh /var/lib/raptor-bench
