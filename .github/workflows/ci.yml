name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: task lint

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: task check:gen

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: task test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: task build
      - name: Cross-compile raptor (static)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o /tmp/raptor-$arch ./cmd/raptor
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: task check:licenses
      - run: task check:vuln
      - run: task check:secrets

  # The container runtime against a real Docker: networks, firewall isolation,
  # limits, hardening. Needs root, so it runs the compiled test binary with sudo.
  e2e-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install nftables
        run: command -v nft || (sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables)
      - name: Build test binaries
        run: |
          go test -c -tags e2e -o /tmp/docker-e2e ./internal/wings/docker
          go test -c -tags e2e -o /tmp/server-e2e ./internal/wings/server
          go test -c -tags e2e -o /tmp/actions-e2e ./internal/wings/actions
          go test -c -tags e2e -o /tmp/storage-e2e ./internal/wings/storage
      - name: Run runtime tests
        run: sudo /tmp/docker-e2e -test.v -test.timeout 20m -test.run 'TestRuntime'
      - name: Run server lifecycle tests
        run: sudo /tmp/server-e2e -test.v -test.timeout 20m
      - name: Run command path tests (grants, passkey signatures, schedules, backups)
        run: sudo /tmp/actions-e2e -test.v -test.timeout 20m
      # Everything but the reboot, which task e2e:quotas covers in the VM.
      - name: Run disk quota tests (XFS loop volume, seccomp escape check)
        run: sudo scripts/e2e-quotas.sh /tmp/storage-e2e /tmp/server-e2e

  # Self-update against the real systemd unit: an update, rollbacks of a
  # crashing and a hanging version, a restart during a trial, with a server
  # that must keep running throughout.
  e2e-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install nftables and minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables minisign
      - name: Build releases and test binaries
        run: |
          scripts/e2e-update-build.sh "$(go env GOARCH)" /tmp/update-e2e
          CGO_ENABLED=0 go build -o /tmp/raptor ./cmd/raptor
          go test -c -tags e2e -o /tmp/server-e2e ./internal/wings/server
      # Like the installer: the version layout, the unit, soft disk limits
      # (quotas have their own tests).
      - name: Install Wings
        run: |
          sudo bash -euc '
            groupadd --system raptor
            useradd --system --gid raptor --no-create-home --shell /usr/sbin/nologin raptor
            install -d -m 0755 /usr/local/lib/raptor
            install -m 0755 /tmp/raptor /usr/local/lib/raptor/raptor-dev
            ln -sfn raptor-dev /usr/local/lib/raptor/current
            ln -sfn /usr/local/lib/raptor/current /usr/local/bin/raptor
            install -m 0644 install/systemd/raptor-wings.service /etc/systemd/system/raptor-wings.service
            install -d -m 0700 /etc/raptor
            printf "storage:\n  quotas: false\n" > /etc/raptor/config.yml
            chmod 0600 /etc/raptor/config.yml
            systemctl daemon-reload
            systemctl start raptor-wings
          '
      - name: Run self-update tests
        run: sudo scripts/e2e-update.sh /tmp/update-e2e /tmp/server-e2e

  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: DCO sign-off
        run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Protobuf breaking changes
        run: go tool -modfile=tools/go.mod buf breaking --against ".git#ref=${{ github.event.pull_request.base.sha }}"
