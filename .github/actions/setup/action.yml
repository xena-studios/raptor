name: Setup
description: Install Go, Node, pnpm, and Task, with caching
inputs:
  node-cache:
    description: >-
      "pnpm" to cache pnpm's store, or "" for jobs that never run pnpm
      install: with nothing to save, a cache miss fails the post step.
    default: pnpm
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: ${{ inputs.node-cache }}
        cache-dependency-path: |
          web/pnpm-lock.yaml
          site/pnpm-lock.yaml
          docs-site/pnpm-lock.yaml
    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.x
