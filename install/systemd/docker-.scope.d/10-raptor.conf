# With Docker's systemd cgroup driver every container is a transient
# docker-<id>.scope unit, and on shutdown systemd stops those scopes itself
# (SIGTERM to the game) in parallel with everything else, before
# raptor-shutdown.service can stop servers with their egg's stop command.
#
# Shutdown runs in the reverse of start order: a unit ordered Before= another
# is stopped after it. So ordering every container scope Before=
# raptor-shutdown makes systemd wait until the graceful stops are done.
# (After= would do the opposite and kill the games first.) It only orders; it
# doesn't start anything.
[Unit]
Before=raptor-shutdown.service
