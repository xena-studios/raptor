# With Docker's systemd cgroup driver every container is a transient
# docker-<id>.scope unit, and on shutdown systemd stops those scopes itself
# (SIGTERM to the game) in parallel with everything else, before
# raptor-shutdown.service can stop servers with their egg's stop command.
# Ordering every container scope after raptor-shutdown makes systemd wait
# for the graceful stops first. It only orders; it doesn't start anything.
[Unit]
After=raptor-shutdown.service
