syntax = "proto3";

package raptor.panel.v1;

import "google/protobuf/timestamp.proto";

// AddonService finds plugins and mods on Modrinth, and plugins on Hangar,
// for servers whose egg turns on an add-on (docs/EGGS.md#add-ons). The
// Panel asks them (with its own user agent, and caches), so the browser
// talks only to Raptor. Installing is the node's addons.install command,
// which fetches only from Modrinth's and Hangar's CDNs and checks the
// file's hash. Any member of the org.
service AddonService {
  // SearchAddons searches a source for a kind's projects that run on the
  // loaders (and game version, if given).
  rpc SearchAddons(SearchAddonsRequest) returns (SearchAddonsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListAddonVersions lists a project's versions for the loaders and game
  // version, newest first.
  rpc ListAddonVersions(ListAddonVersionsRequest) returns (ListAddonVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // IdentifyAddons says which project and version each file is (on
  // Modrinth by its SHA-512, then on Hangar by its SHA-256), and the newest
  // version for the loaders and game version.
  rpc IdentifyAddons(IdentifyAddonsRequest) returns (IdentifyAddonsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // LookupWorkshopItems says what Steam Workshop items and collections are,
  // by ID, for games whose egg takes them (docs/EGGS.md#steam-workshop).
  // The game downloads them itself; this only names them.
  rpc LookupWorkshopItems(LookupWorkshopItemsRequest) returns (LookupWorkshopItemsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ResolveAddonDependencies says what else a Modrinth version needs
  // installed (#434): its required dependencies and theirs, each at the
  // newest version for the loaders and game version, and its optional
  // ones, leaving out projects already installed. It also names installed
  // projects it can't run beside.
  rpc ResolveAddonDependencies(ResolveAddonDependenciesRequest) returns (ResolveAddonDependenciesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // LookupMinecraftPlayer is a Minecraft account by name (#422): its name
  // as Mojang has it and its UUID, for editing a stopped server's
  // whitelist, ops, and bans; with offline, the UUID an offline-mode
  // server gives the name (no lookup).
  rpc LookupMinecraftPlayer(LookupMinecraftPlayerRequest) returns (LookupMinecraftPlayerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListGameVersions lists the versions a game's server software has,
  // newest first, for the version switcher (#420): "paper", "folia",
  // "velocity", "waterfall", "purpur", "vanilla", "fabric", or "quilt".
  rpc ListGameVersions(ListGameVersionsRequest) returns (ListGameVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message AddonProject {
  string id = 1;
  string slug = 2;
  string title = 3;
  string description = 4;
  string icon_url = 5;
  int64 downloads = 6;
  string author = 7;
  // Its page on its source.
  string url = 8;
  // "modrinth" or "hangar".
  string source = 9;
  // Modrinth's mods: whether it runs on a server ("required", "optional",
  // or "unsupported": client-only), and on the client.
  string server_side = 10;
  string client_side = 11;
}

message AddonDependency {
  string project_id = 1;
  // A specific version, if it names one.
  string version_id = 2;
  // "required", "optional", "incompatible", or "embedded".
  string type = 3;
}

message AddonFile {
  string url = 1;
  string filename = 2;
  int64 size = 3;
  // Modrinth's files have a SHA-512, Hangar's a SHA-256, uMod's a SHA-1.
  string sha512 = 4;
  string sha256 = 5;
  string sha1 = 6;
}

message AddonVersion {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string version_number = 4;
  repeated string game_versions = 5;
  repeated string loaders = 6;
  google.protobuf.Timestamp published_at = 7;
  // The version's main file.
  AddonFile file = 8;
  // Modrinth's: what else it needs, may use, or can't run beside.
  repeated AddonDependency dependencies = 9;
}

message SearchAddonsRequest {
  string org_id = 1;
  // "plugins", "mods", or "datapacks"; or "modpacks", for the pack picker
  // (Modrinth, loaders optional).
  string kind = 2;
  repeated string loaders = 3;
  // Empty: any.
  string game_version = 4;
  string query = 5;
  int32 offset = 6;
  // "modrinth" (the default), "hangar" (plugins only), or "umod" (the
  // umod kind, which has only uMod).
  string source = 7;
  // Mods only: include client-only ones (left out by default, since they
  // don't run on a server).
  bool include_client_only = 8;
}

message SearchAddonsResponse {
  repeated AddonProject projects = 1;
  int32 total = 2;
}

message ListAddonVersionsRequest {
  string org_id = 1;
  string project_id = 2;
  repeated string loaders = 3;
  string game_version = 4;
  // The project's source: "modrinth" (the default), "hangar", or "umod".
  string source = 5;
  // "modpacks" for a modpack's versions (no loaders needed); empty for
  // add-ons.
  string kind = 6;
}

message ListAddonVersionsResponse {
  repeated AddonVersion versions = 1;
}

message IdentifyAddonsRequest {
  string org_id = 1;
  // SHA-512s, from the node's addons.list.
  repeated string hashes = 2;
  repeated string loaders = 3;
  string game_version = 4;
  // The files' SHA-256s, by SHA-512: files Modrinth doesn't know are
  // looked up on Hangar.
  map<string, string> sha256 = 5;
  // uMod plugins (the umod kind) are named by file: each file's name and
  // SHA-1, by SHA-512. uMod lists only a plugin's newest file, so a file
  // that isn't it is offered the update.
  map<string, string> names = 6;
  map<string, string> sha1 = 7;
}

message IdentifiedAddon {
  string sha512 = 1;
  AddonProject project = 2;
  AddonVersion version = 3;
  // The newest version for the loaders and game version, when it isn't
  // this one.
  AddonVersion latest = 4;
}

message IdentifyAddonsResponse {
  // Files neither knows are left out.
  repeated IdentifiedAddon addons = 1;
}

message LookupWorkshopItemsRequest {
  string org_id = 1;
  // Item or collection IDs (digits), at most 100.
  repeated string ids = 2;
}

message WorkshopItem {
  string id = 1;
  // The game it's for: an item for another game won't load.
  int64 app_id = 2;
  string title = 3;
  // Its image, on images.steamusercontent.com; empty if none.
  string preview_url = 4;
  // Bytes; 0 for a collection.
  int64 size = 5;
  google.protobuf.Timestamp updated_at = 6;
  bool collection = 7;
  // A collection's items, in its order.
  repeated string children = 8;
}

message LookupWorkshopItemsResponse {
  // IDs Steam doesn't have, or that aren't public, are left out.
  repeated WorkshopItem items = 1;
}

message ResolveAddonDependenciesRequest {
  string org_id = 1;
  // The Modrinth version to install.
  string version_id = 2;
  repeated string loaders = 3;
  string game_version = 4;
  // Projects already on the server (Modrinth IDs, or Factorio mod names),
  // left out of what's needed and checked against incompatible ones.
  repeated string installed = 5;
  // "modrinth" (the default) or "factorio" (version_id is "mod@version").
  string source = 6;
}

message ResolvedAddon {
  AddonProject project = 1;
  AddonVersion version = 2;
  // The project that needs it, for "needed by".
  string needed_by = 3;
}

message ResolveAddonDependenciesResponse {
  // To install with it, dependencies first.
  repeated ResolvedAddon required = 1;
  // Its optional dependencies (only its own, not theirs).
  repeated ResolvedAddon optional = 2;
  // Installed projects it can't run beside.
  repeated AddonProject incompatible = 3;
  // Required dependencies with no version for these loaders and game
  // version, or outside Modrinth (a file name only: project.title).
  repeated AddonProject unavailable = 4;
}

message ListGameVersionsRequest {
  string org_id = 1;
  string source = 2;
}

message GameVersion {
  string id = 1;
  // A release, not a snapshot, pre-release, or release candidate.
  bool stable = 2;
}

message ListGameVersionsResponse {
  // Newest first.
  repeated GameVersion versions = 1;
}

message LookupMinecraftPlayerRequest {
  string org_id = 1;
  string name = 2;
  bool offline = 3;
}

message LookupMinecraftPlayerResponse {
  string name = 1;
  string uuid = 2;
}
