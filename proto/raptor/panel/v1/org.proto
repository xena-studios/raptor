syntax = "proto3";

package raptor.panel.v1;

import "google/protobuf/timestamp.proto";
import "raptor/panel/v1/audit.proto";
import "raptor/panel/v1/auth.proto";

// OrgService manages orgs, their members, and invitations
// (docs/PANEL.md#permissions). Roles: owners can do everything, including
// changing roles; admins manage members, invitations, and nodes; members
// see the org and what their server grants allow. Orgs someone isn't in
// are NOT_FOUND to them.
service OrgService {
  // CreateOrg makes an org with the caller as its owner.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse) {}

  // ListOrgs lists the caller's orgs and their role in each.
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RenameOrg renames an org. Admins and owners.
  rpc RenameOrg(RenameOrgRequest) returns (RenameOrgResponse) {}

  // ListMembers lists an org's members. Any member.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetMemberRole changes a member's role. Owners only; an org always keeps
  // an owner.
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse) {}

  // RemoveMember removes someone from an org: owners remove anyone, admins
  // remove members, and anyone can leave. An org always keeps an owner.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {}

  // InviteMember emails an invitation for 7 days. Admins invite admins and
  // members; owners invite anyone.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse) {}

  // ListInvitations lists an org's pending invitations. Admins and owners.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RevokeInvitation cancels a pending invitation. Admins and owners.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {}

  // AcceptInvitation joins the org, if the caller is signed in with the
  // address the invitation was sent to.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {}

  // CreateJoinToken makes a single-use token that links one node to the org
  // (raptor link / raptor bootstrap), valid for an hour and shown once.
  // Admins and owners, with a recent re-authentication: a node runs as
  // root, so adding one is a sensitive change.
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse) {}

  // SetServerAccess sets what a member may do on one server (no
  // permissions removes their access). Admins and owners. Admins and owners
  // themselves can always do everything.
  rpc SetServerAccess(SetServerAccessRequest) returns (SetServerAccessResponse) {}

  // ListServerAccess lists who has access to a server. Admins and owners.
  rpc ListServerAccess(ListServerAccessRequest) returns (ListServerAccessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListNodes lists the org's nodes. Admins and owners see all of them;
  // members see the ones with servers they have access to.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RenameNode renames a node. Admins and owners.
  rpc RenameNode(RenameNodeRequest) returns (RenameNodeResponse) {}

  // RemoveNode takes a node out of the org: its key is refused from now
  // on, its DNS name stops pointing at it, and its mirror and members'
  // grants are dropped. Its servers keep running on the machine, and
  // relinking it with a join token brings it back. Admins and owners, after
  // re-authenticating.
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse) {}

  // ListServers lists a node's servers as the Panel's mirror has them, with
  // what the caller may do on each. Members see only the servers they have
  // access to.
  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetServer returns one server as the mirror has it. With the startup
  // permission (admins and owners always), also its settings and its egg's
  // images and variables, for the settings page: variables can hold
  // secrets (tokens, passwords), so nobody else gets them.
  rpc GetServer(GetServerRequest) returns (GetServerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // PinJoinToken attaches the owner's passkey, signed in the browser over
  // the token (nodecmd.OwnerPin), to a new join token: the node that links
  // with it checks the signature and trusts that passkey from the start.
  // Admins and owners, for one of their own passkeys.
  rpc PinJoinToken(PinJoinTokenRequest) returns (PinJoinTokenResponse) {}

  // ListMemberPasskeys lists a member's passkeys (names and public keys),
  // for an owner to let one of them sign dangerous actions on a node (a
  // delegation, which the owner's own passkey signs). Admins and owners.
  rpc ListMemberPasskeys(ListMemberPasskeysRequest) returns (ListMemberPasskeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListAuditLog lists the org's audit log, newest first, 50 at a time.
  // Admins and owners.
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListSchedules lists a server's schedules as the mirror has them. Needs
  // the schedules permission.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetSFTPAccess says whether the caller has a temporary SFTP password
  // for a server, and how to connect. Needs the sftp permission.
  rpc GetSFTPAccess(GetSFTPAccessRequest) returns (GetSFTPAccessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateSFTPAccess makes the caller a temporary SFTP password for a
  // server, replacing any they had. The password is only ever in this
  // answer. Needs the sftp permission.
  rpc CreateSFTPAccess(CreateSFTPAccessRequest) returns (CreateSFTPAccessResponse) {}

  // RevokeSFTPAccess deletes the caller's temporary SFTP password for a
  // server. The web app then sends sftp.disconnect to end its sessions.
  rpc RevokeSFTPAccess(RevokeSFTPAccessRequest) returns (RevokeSFTPAccessResponse) {}

  // ListBackups lists a server's backups as the mirror has them, newest
  // first. Needs the backups permission.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_MEMBER = 1;
  ROLE_ADMIN = 2;
  ROLE_OWNER = 3;
}

message Org {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  // The caller's role.
  Role role = 4;
}

message CreateOrgRequest {
  string name = 1;
}

message CreateOrgResponse {
  Org org = 1;
}

message ListOrgsRequest {}

message ListOrgsResponse {
  repeated Org orgs = 1;
}

message RenameOrgRequest {
  string org_id = 1;
  string name = 2;
}

message RenameOrgResponse {}

message Member {
  string user_id = 1;
  string email = 2;
  string name = 3;
  Role role = 4;
  google.protobuf.Timestamp joined_at = 5;
}

message ListMembersRequest {
  string org_id = 1;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message SetMemberRoleRequest {
  string org_id = 1;
  string user_id = 2;
  Role role = 3;
}

message SetMemberRoleResponse {}

message RemoveMemberRequest {
  string org_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {}

message Invitation {
  string id = 1;
  string email = 2;
  Role role = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message InviteMemberRequest {
  string org_id = 1;
  string email = 2;
  Role role = 3;
}

message InviteMemberResponse {
  Invitation invitation = 1;
}

message ListInvitationsRequest {
  string org_id = 1;
}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
}

message RevokeInvitationRequest {
  string org_id = 1;
  string invitation_id = 2;
}

message RevokeInvitationResponse {}

message AcceptInvitationRequest {
  // The token from the emailed link (after # in /invite#<token>).
  string token = 1;
}

message AcceptInvitationResponse {
  Org org = 1;
}

message CreateJoinTokenRequest {
  string org_id = 1;
  // What to call the node until it reports its hostname.
  string name = 2;
}

message CreateJoinTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListAuditLogRequest {
  string org_id = 1;
  // next_page_token from the previous page.
  string page_token = 2;
  // With both set, only the commands sent to that server.
  string node_id = 3;
  string server_id = 4;
}

message ListAuditLogResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}

message SetServerAccessRequest {
  string org_id = 1;
  string node_id = 2;
  string server_id = 3;
  string user_id = 4;
  // "console.write", "power", "files.read", "files.write", "backups",
  // "schedules", "startup", "reinstall", "sftp".
  repeated string permissions = 5;
}

message SetServerAccessResponse {}

message ListServerAccessRequest {
  string org_id = 1;
  string node_id = 2;
  string server_id = 3;
}

message ServerAccess {
  string user_id = 1;
  string email = 2;
  repeated string permissions = 3;
}

message ListServerAccessResponse {
  repeated ServerAccess access = 1;
}

message ListNodesRequest {
  string org_id = 1;
}

message Node {
  string id = 1;
  string name = 2;
  // n-<short_id>.raptornodes.net
  string short_id = 3;
  string wings_version = 4;
  bool connected = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  google.protobuf.Timestamp created_at = 7;
  // What the node reported when it last linked: its CPU architecture
  // (amd64, arm64), cores, and memory.
  string arch = 8;
  int32 cpus = 9;
  int64 memory_bytes = 10;
  // Whether it serves SFTP (node.sftp), on which port, and its host key's
  // fingerprint, as it last reported them.
  bool sftp_enabled = 11;
  int32 sftp_port = 12;
  string sftp_host_key_fingerprint = 13;
}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message RenameNodeRequest {
  string org_id = 1;
  string node_id = 2;
  string name = 3;
}

message RenameNodeResponse {}

message RemoveNodeRequest {
  string org_id = 1;
  string node_id = 2;
}

message RemoveNodeResponse {}

message ListServersRequest {
  string org_id = 1;
  string node_id = 2;
}

message Server {
  string id = 1;
  string name = 2;
  // "running", "offline", "starting", ...
  string state = 3;
  string egg_name = 4;
  // What the caller may do on it ("*" for admins and owners: everything).
  repeated string permissions = 5;
  // The ports its allocations use, the primary first.
  repeated int32 ports = 6;
  // The install: "pending", "installing", "installed", or "failed" (with
  // install_error).
  string install_state = 7;
  string install_error = 8;
}

message ListServersResponse {
  repeated Server servers = 1;
}

message GetServerRequest {
  string org_id = 1;
  string node_id = 2;
  string server_id = 3;
}

message GetServerResponse {
  Server server = 1;
  // The settings as the node last reported them, as JSON: image, startup,
  // variables, limits, settings, host_network, allocations, and egg (its
  // images, variables, and features). Empty without the startup
  // permission. The web app changes them and sends them back with
  // server.update.
  string config_json = 2;
}

message PinJoinTokenRequest {
  string org_id = 1;
  // The rpt_join_… token, as CreateJoinToken returned it.
  string token = 2;
  // nodecmd.OwnerPin, as JSON.
  string pin_json = 3;
}

message PinJoinTokenResponse {}

message ListMemberPasskeysRequest {
  string org_id = 1;
  string user_id = 2;
}

message ListMemberPasskeysResponse {
  // name, credential_id, public_key, and created_at are set.
  repeated Passkey passkeys = 1;
}

message ListSchedulesRequest {
  string org_id = 1;
  string node_id = 2;
  string server_id = 3;
}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
}

message Schedule {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  google.protobuf.Timestamp next_run = 4;
  google.protobuf.Timestamp last_run = 5;
  // What schedule.create and schedule.update take, as JSON: cron, timezone,
  // steps, and the rest.
  string definition_json = 6;
}

message ListBackupsRequest {
  string org_id = 1;
  string node_id = 2;
  string server_id = 3;
}

message ListBackupsResponse {
  repeated Backup backups = 1;
}

message Backup {
  string id = 1;
  // "manual", "scheduled", "safety" (taken before a restore or a wipe), or
  // "final" (taken before the server was deleted).
  string kind = 2;
  // "pending", "running", "ok", or "failed".
  string status = 3;
  // Retention never deletes a locked backup.
  bool locked = 4;
  int64 size = 5;
  int64 files = 6;
  string error = 7;
  string warning = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  google.protobuf.Timestamp expires_at = 11;
}

message GetSFTPAccessRequest {
  string org_id = 1;
  string node_id = 2;
  string server_id = 3;
}

message GetSFTPAccessResponse {
  // Unset without a password that's still good.
  SFTPAccess access = 1;
}

// SFTPAccess is how to connect: host, port, and the full username
// (<username>.<server short ID>). The password isn't stored.
message SFTPAccess {
  string host = 1;
  int32 port = 2;
  string username = 3;
  google.protobuf.Timestamp expires_at = 4;
  string host_key_fingerprint = 5;
}

message CreateSFTPAccessRequest {
  string org_id = 1;
  string node_id = 2;
  string server_id = 3;
  // How long it works: 1 hour to 30 days; 0 for a day.
  int64 ttl_seconds = 4;
}

message CreateSFTPAccessResponse {
  SFTPAccess access = 1;
  string password = 2;
}

message RevokeSFTPAccessRequest {
  string org_id = 1;
  string node_id = 2;
  string server_id = 3;
}

message RevokeSFTPAccessResponse {
  // The login's first part, for sftp.disconnect; empty if there was none.
  string username = 1;
}
