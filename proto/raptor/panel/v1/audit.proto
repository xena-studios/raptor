syntax = "proto3";

package raptor.panel.v1;

import "google/protobuf/timestamp.proto";

// An entry in the audit log.
message AuditEvent {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  // What happened: "signin.email", "passkey.add", "member.role", ...
  // (docs/PANEL.md#audit-log).
  string action = 3;
  // "user", "staff", or "system".
  string actor = 4;
  // Who did it, for org events (empty if they're no longer visible).
  string actor_email = 5;
  // What it was done to: a session, passkey, member, or invitation ID.
  string target = 6;
  string ip = 7;
  string user_agent = 8;
  // Details, as a JSON object.
  string metadata_json = 9;
  // Who it was about, for org events about a member (their role, access,
  // removal), if they still have an account.
  string subject_email = 10;
}

// ActivityFilter narrows an activity list (docs/PANEL.md#audit-log). Unset
// fields don't narrow it.
message ActivityFilter {
  // Words to look for in an event's details: email addresses, names, IP
  // addresses, devices, its action. Up to 100 characters.
  string query = 1;
  // From this time (inclusive) to this one (exclusive).
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // An IP address, or a range ("203.0.113.0/24").
  string ip = 4;
  // Who did it: a user's ID. Org logs only.
  string actor_id = 5;
  // Kinds of event: actions ("server.start") or prefixes ending in "%"
  // ("files.%"). A command matches by its own action. Up to 30.
  repeated string actions = 6;
  // Only what failed: failed sign-ins and commands that failed.
  bool failed = 7;
}
