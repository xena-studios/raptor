syntax = "proto3";

package raptor.panel.v1;

import "google/protobuf/timestamp.proto";

// CatalogEgg is an egg in the library (EggService, docs/PANEL.md#eggs), as
// lists show it and server creation needs it. (The name is from when it
// described the built-in catalog, which is now part of the official
// library.)
message CatalogEgg {
  string id = 1;
  string name = 2;
  string description = 3;
  // "minecraft", "steam", ... (docs/PANEL.md#eggs).
  string category = 4;
  // The file is the one Raptor's conformance suite tests (eggs/ in the
  // repository); editing it clears this.
  bool certified = 5;
  // The CPU architectures the game runs on: amd64, arm64.
  repeated string arch = 6;
  // In the egg's order; the first is the default.
  repeated EggImage images = 7;
  repeated EggVariable variables = 8;
  // The egg's features: "eula" means the user must accept the game's EULA.
  repeated string features = 9;
  // Where the egg comes from: for Raptor's catalog, the upstream file at
  // the copied commit; for an imported egg, the link it was fetched from.
  string source_url = 10;

  // One line for the egg's card.
  string summary = 11;
  // "official" (Raptor's, managed by staff), "org" (the org's own), or
  // "community" (another org's, shared).
  string scope = 12;
  // How it came to be: "catalog" (Raptor's catalog), "scratch", "import",
  // or "fork" (a customized copy).
  string origin = 13;
  // "draft", "published" (can be deployed), or "archived".
  string status = 14;
  int32 version = 15;
  // How many servers were made from it: the org's, or everyone's in the
  // official library.
  int32 servers = 16;
  // What a customized copy was made from.
  string parent_id = 17;
  string parent_name = 18;
  google.protobuf.Timestamp updated_at = 19;
  string created_by = 20;

  // Community eggs (docs/PANEL.md#community-eggs).

  // The org that made it, for eggs another org shared.
  string publisher = 21;
  // When its org shared it with everyone; unset: not shared.
  google.protobuf.Timestamp shared_at = 22;
  // How many orgs added it to their eggs.
  int32 copies = 23;
  // Set when Raptor's staff took it out of the community, and why. Only
  // its org and staff see it.
  bool removed = 24;
  string removed_reason = 25;
}

message EggImage {
  string name = 1;
  string ref = 2;
}

message EggVariable {
  string name = 1;
  string description = 2;
  string env = 3;
  string default = 4;
  bool user_viewable = 5;
  bool user_editable = 6;
  // Laravel validation rules ("required", "max:20", ...), which Wings checks.
  repeated string rules = 7;
}
