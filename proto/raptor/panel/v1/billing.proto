syntax = "proto3";

package raptor.panel.v1;

import "google/protobuf/timestamp.proto";

// BillingService is an org's plan, through Polar (docs/PANEL.md#billing-polar):
// one subscription per org whose seats follow its linked nodes. Members of
// the org see it; owners start and manage it.
service BillingService {
  // GetBilling says where the org stands.
  rpc GetBilling(GetBillingRequest) returns (GetBillingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // StartCheckout returns a link to Polar's checkout for a plan (the first
  // month free, once per org). Owners.
  rpc StartCheckout(StartCheckoutRequest) returns (StartCheckoutResponse) {}

  // OpenBillingPortal returns a link to Polar's customer portal: the card,
  // invoices, and cancelling. Owners.
  rpc OpenBillingPortal(OpenBillingPortalRequest) returns (OpenBillingPortalResponse) {}

  // EndTrial ends the free month now, so more nodes can be linked. Owners.
  rpc EndTrial(EndTrialRequest) returns (EndTrialResponse) {}

  // GetBillingDetails lists the org's saved cards and its charges, from
  // Polar. Owners.
  rpc GetBillingDetails(GetBillingDetailsRequest) returns (GetBillingDetailsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // StartAddCard returns a customer session for Polar's embedded form for
  // adding a card. Owners, with a recent re-authentication.
  rpc StartAddCard(StartAddCardRequest) returns (StartAddCardResponse) {}

  // SetDefaultCard charges the plan to another saved card. Owners, with a
  // recent re-authentication.
  rpc SetDefaultCard(SetDefaultCardRequest) returns (SetDefaultCardResponse) {}

  // RemoveCard deletes a saved card that isn't the one the plan is charged
  // to. Owners, with a recent re-authentication.
  rpc RemoveCard(RemoveCardRequest) returns (RemoveCardResponse) {}

  // GetInvoice returns a link to a charge's invoice. Polar makes it the
  // first time, which takes a few seconds: UNAVAILABLE until then. Owners.
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse) {}

  // CancelPlan ends the plan with its period, or with resume takes that
  // back. Owners, with a recent re-authentication.
  rpc CancelPlan(CancelPlanRequest) returns (CancelPlanResponse) {}
}

message GetBillingRequest {
  string org_id = 1;
}

message GetBillingResponse {
  // False while this Panel doesn't charge; the rest is then empty.
  bool enabled = 1;
  // Polar's status: trialing, active, past_due, canceled, unpaid, …;
  // empty if the org never had a plan.
  string status = 2;
  int32 seats = 3;
  int32 nodes = 4;
  int64 node_price_cents = 5;
  google.protobuf.Timestamp current_period_end = 6;
  google.protobuf.Timestamp trial_end = 7;
  bool cancel_at_period_end = 8;
  // Set while the org is unpaid: when its nodes go (or went) read-only.
  google.protobuf.Timestamp read_only_at = 9;
  bool read_only = 10;
  bool trial_available = 11;
  // A waiver from Raptor in force, if any (DECISIONS #334).
  BillingWaiver waiver = 12;
  // How many of the org's nodes are free under it now: they're not
  // charged, and need no plan.
  int32 free_nodes = 13;
  // A node linked now would be free too, so Add Node needs no plan.
  bool free_next_node = 14;
  // Raptor Backup Storage (DECISIONS #335): whether this Panel charges for
  // use past what's included, the org's latest measured use, what's
  // included (10 GB a node), and, from Polar, whether the plan has the
  // storage price and what's due for it so far this period.
  bool storage_billing = 15;
  int64 storage_used_bytes = 16;
  int64 storage_included_bytes = 17;
  google.protobuf.Timestamp storage_measured_at = 18;
  bool storage_priced = 19;
  int64 storage_period_cents = 20;
  int64 storage_cents_per_tb = 21;
}

// BillingWaiver is nodes (and optionally Backup Storage) Raptor gives an
// org free. The reason staff gave isn't shown.
message BillingWaiver {
  // Every node free, or free_nodes of them.
  bool all_nodes = 1;
  int32 free_nodes = 2;
  // Raptor Backup Storage past the included amount is free too.
  bool storage = 3;
  // When it ends; unset: until Raptor ends it.
  google.protobuf.Timestamp ends_at = 4;
}

message StartCheckoutRequest {
  string org_id = 1;
}

message StartCheckoutResponse {
  string url = 1;
  // Polar's origin, which the app opens the checkout from.
  string polar_origin = 2;
}

message OpenBillingPortalRequest {
  string org_id = 1;
}

message OpenBillingPortalResponse {
  string url = 1;
}

message EndTrialRequest {
  string org_id = 1;
}

message EndTrialResponse {}

message GetBillingDetailsRequest {
  string org_id = 1;
}

message Card {
  string id = 1;
  // card, or another way to pay Polar offers.
  string type = 2;
  string brand = 3;
  string last4 = 4;
  int32 exp_month = 5;
  int32 exp_year = 6;
  // apple_pay, google_pay, or empty.
  string wallet = 7;
  // The one the plan is charged to.
  bool default = 8;
}

// Charge is a Polar order: the first payment, a renewal, or a seat change.
message Charge {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  // paid, pending, refunded, partially_refunded, void, …
  string status = 3;
  int64 total_cents = 4;
  int64 refunded_cents = 5;
  string currency = 6;
  // purchase, subscription_create, subscription_cycle, subscription_update
  string reason = 7;
  string description = 8;
  string invoice_number = 9;
}

message GetBillingDetailsResponse {
  repeated Card cards = 1;
  // Newest first, the last 24.
  repeated Charge charges = 2;
}

message StartAddCardRequest {
  string org_id = 1;
}

message StartAddCardResponse {
  // A customer session token: an hour, for this org's customer only.
  string session_token = 1;
  // Polar's origin, which serves the form.
  string polar_origin = 2;
}

message SetDefaultCardRequest {
  string org_id = 1;
  string card_id = 2;
}

message SetDefaultCardResponse {}

message RemoveCardRequest {
  string org_id = 1;
  string card_id = 2;
}

message RemoveCardResponse {}

message GetInvoiceRequest {
  string org_id = 1;
  string charge_id = 2;
}

message GetInvoiceResponse {
  string url = 1;
}

message CancelPlanRequest {
  string org_id = 1;
  // Take a cancellation back.
  bool resume = 2;
  // One of Polar's: too_expensive, missing_features, switched_service,
  // unused, customer_service, low_quality, too_complex, other; or empty.
  string reason = 3;
  string comment = 4;
}

message CancelPlanResponse {}
