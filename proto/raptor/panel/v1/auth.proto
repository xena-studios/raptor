syntax = "proto3";

package raptor.panel.v1;

import "google/protobuf/timestamp.proto";
import "raptor/panel/v1/audit.proto";

// AuthService signs people in and out of the Panel (docs/PANEL.md#auth).
// The session is a host-only __Host- cookie the Panel sets; nothing here
// returns a token to scripts.
service AuthService {
  // StartEmailSignIn emails a 6-digit code and a sign-in link for the
  // address (signing up if it's new). The answer is the same whether or not
  // an account exists.
  rpc StartEmailSignIn(StartEmailSignInRequest) returns (StartEmailSignInResponse) {}

  // FinishEmailSignIn checks a code (with its email) or a link token, and
  // starts a session.
  rpc FinishEmailSignIn(FinishEmailSignInRequest) returns (FinishEmailSignInResponse) {}

  // GetSession returns who's signed in. UNAUTHENTICATED if no one is.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SignOut ends this session.
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {}

  // ListSessions lists the user's devices.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RevokeSession signs one of the user's devices out (or all but this one).
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {}

  // BeginPasskeySignIn starts a passkey sign-in. The browser passes
  // options_json to navigator.credentials.get; no email is needed, since
  // passkeys know their account.
  rpc BeginPasskeySignIn(BeginPasskeySignInRequest) returns (BeginPasskeySignInResponse) {}

  // FinishPasskeySignIn checks the passkey's answer and starts a session.
  rpc FinishPasskeySignIn(FinishPasskeySignInRequest) returns (FinishPasskeySignInResponse) {}

  // BeginPasskeyRegistration starts adding a passkey to the signed-in
  // account. Needs a recent re-authentication.
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse) {}

  // FinishPasskeyRegistration checks the new passkey and saves it.
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse) {}

  // ListPasskeys lists the account's passkeys.
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RenamePasskey renames one of the account's passkeys.
  rpc RenamePasskey(RenamePasskeyRequest) returns (RenamePasskeyResponse) {}

  // DeletePasskey removes one of the account's passkeys. Needs a recent
  // re-authentication.
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse) {}

  // BeginReauth starts confirming it's really the user, before a sensitive
  // account change: with a passkey if the account has one, otherwise with a
  // code emailed to them.
  rpc BeginReauth(BeginReauthRequest) returns (BeginReauthResponse) {}

  // FinishReauth checks the passkey's answer, the authenticator app's code,
  // or the emailed code. A re-authentication lasts 5 minutes.
  rpc FinishReauth(FinishReauthRequest) returns (FinishReauthResponse) {}

  // FinishSecondFactor finishes a sign-in that needed a second factor (an
  // email sign-in to an account with TOTP), with an authenticator app's code
  // or a recovery code. The pending sign-in is in a cookie.
  rpc FinishSecondFactor(FinishSecondFactorRequest) returns (FinishSecondFactorResponse) {}

  // BeginTOTPSetup makes a new authenticator app secret. Needs a recent
  // re-authentication.
  rpc BeginTOTPSetup(BeginTOTPSetupRequest) returns (BeginTOTPSetupResponse) {}

  // FinishTOTPSetup turns TOTP on once a code from the app checks out, and
  // returns new recovery codes (shown once).
  rpc FinishTOTPSetup(FinishTOTPSetupRequest) returns (FinishTOTPSetupResponse) {}

  // DisableTOTP turns TOTP off and deletes the recovery codes. Needs a
  // recent re-authentication.
  rpc DisableTOTP(DisableTOTPRequest) returns (DisableTOTPResponse) {}

  // RegenerateRecoveryCodes replaces the recovery codes. Needs a recent
  // re-authentication.
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse) {}

  // GetSignInMethods says which ways to sign in this Panel offers, for the
  // sign-in page.
  rpc GetSignInMethods(GetSignInMethodsRequest) returns (GetSignInMethodsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // BeginOAuth starts signing in with (or, signed in, linking) a Google,
  // GitHub, or Discord account. It sets a short-lived state cookie and
  // returns the provider's URL, which the web app navigates to; the
  // provider sends the browser back to the API's /oauth/<provider>/callback,
  // which redirects to the web app. Linking needs a recent
  // re-authentication.
  rpc BeginOAuth(BeginOAuthRequest) returns (BeginOAuthResponse) {}

  // ListOAuthAccounts lists the Google, GitHub, and Discord accounts that
  // can sign in to this account.
  rpc ListOAuthAccounts(ListOAuthAccountsRequest) returns (ListOAuthAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UnlinkOAuthAccount stops one signing in. Needs a recent
  // re-authentication.
  rpc UnlinkOAuthAccount(UnlinkOAuthAccountRequest) returns (UnlinkOAuthAccountResponse) {}

  // ListActivity lists the account's sign-ins, failed attempts, and
  // security changes, newest first, 50 at a time.
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message StartEmailSignInRequest {
  string email = 1;
  // Cloudflare Turnstile's token from the form.
  string turnstile_token = 2;
}

message StartEmailSignInResponse {}

message FinishEmailSignInRequest {
  oneof proof {
    EmailCode code = 1;
    // The token from the emailed link.
    string link_token = 2;
  }
}

message EmailCode {
  string email = 1;
  string code = 2;
}

message FinishEmailSignInResponse {
  User user = 1;
  // The account was created by this sign-in.
  bool new_account = 2;
  // The account has TOTP: the sign-in isn't finished until
  // FinishSecondFactor (user is unset until then).
  bool second_factor_required = 3;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  bool totp_enabled = 4;
}

message GetSessionRequest {}

message GetSessionResponse {
  User user = 1;
  Session session = 2;
  // Unused recovery codes (0 without TOTP).
  int32 recovery_codes_left = 3;
}

message Session {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp last_seen_at = 3;
  string ip = 4;
  string user_agent = 5;
  // This is the session making the request.
  bool current = 6;
  // Sensitive account changes are allowed until then (the current session
  // only; unset if they need a re-authentication).
  google.protobuf.Timestamp reauth_until = 7;
}

message SignOutRequest {}

message SignOutResponse {}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  oneof target {
    string id = 1;
    // Every session but the current one.
    bool all_others = 2;
  }
}

message RevokeSessionResponse {}

// A WebAuthn ceremony the browser runs: options_json is the "publicKey"
// options in WebAuthn's JSON form (for PublicKeyCredential.parse*OptionsFromJSON),
// and ceremony_id comes back with the answer.
message PasskeyChallenge {
  string ceremony_id = 1;
  string options_json = 2;
}

// The browser's answer: PublicKeyCredential.toJSON().
message PasskeyAnswer {
  string ceremony_id = 1;
  string credential_json = 2;
}

message BeginPasskeySignInRequest {}

message BeginPasskeySignInResponse {
  PasskeyChallenge challenge = 1;
}

message FinishPasskeySignInRequest {
  PasskeyAnswer answer = 1;
}

message FinishPasskeySignInResponse {
  User user = 1;
}

message BeginPasskeyRegistrationRequest {}

message BeginPasskeyRegistrationResponse {
  PasskeyChallenge challenge = 1;
}

message FinishPasskeyRegistrationRequest {
  PasskeyAnswer answer = 1;
  // What the user calls it ("Phone", "YubiKey"). Up to 64 characters.
  string name = 2;
}

message FinishPasskeyRegistrationResponse {
  Passkey passkey = 1;
}

message Passkey {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
  // The passkey is synced between devices (iCloud Keychain, Google Password
  // Manager) rather than bound to one device or security key.
  bool synced = 5;
}

message ListPasskeysRequest {}

message ListPasskeysResponse {
  repeated Passkey passkeys = 1;
}

message RenamePasskeyRequest {
  string id = 1;
  string name = 2;
}

message RenamePasskeyResponse {}

message DeletePasskeyRequest {
  string id = 1;
}

message DeletePasskeyResponse {}

message BeginReauthRequest {}

message BeginReauthResponse {
  oneof method {
    // The account has passkeys: one of them must answer this.
    PasskeyChallenge passkey = 1;
    // The account has no passkeys or TOTP: a 6-digit code was emailed.
    bool email_sent = 2;
  }
  // The account has TOTP, so a code from the authenticator app works too
  // (or alone, if method is unset).
  bool totp_allowed = 3;
}

message FinishReauthRequest {
  oneof proof {
    PasskeyAnswer passkey = 1;
    string email_code = 2;
    string totp_code = 3;
  }
}

message FinishReauthResponse {
  google.protobuf.Timestamp reauth_until = 1;
}

message FinishSecondFactorRequest {
  oneof proof {
    string totp_code = 1;
    string recovery_code = 2;
  }
}

message FinishSecondFactorResponse {
  User user = 1;
  // Unused recovery codes left (when one was used).
  int32 recovery_codes_left = 2;
}

message BeginTOTPSetupRequest {}

message BeginTOTPSetupResponse {
  // Base32, for typing into the app.
  string secret = 1;
  // otpauth:// URL, for a QR code.
  string url = 2;
}

message FinishTOTPSetupRequest {
  string code = 1;
}

message FinishTOTPSetupResponse {
  repeated string recovery_codes = 1;
}

message DisableTOTPRequest {}

message DisableTOTPResponse {}

message RegenerateRecoveryCodesRequest {}

message RegenerateRecoveryCodesResponse {
  repeated string recovery_codes = 1;
}

message GetSignInMethodsRequest {}

message GetSignInMethodsResponse {
  bool email = 1;
  bool passkeys = 2;
  // "google", "github", "discord": the ones set up on this Panel.
  repeated string oauth_providers = 3;
}

message BeginOAuthRequest {
  string provider = 1;
  // Link the provider's account to the signed-in account instead of
  // signing in.
  bool link = 2;
}

message BeginOAuthResponse {
  string url = 1;
}

message OAuthAccount {
  string id = 1;
  string provider = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_used_at = 5;
}

message ListOAuthAccountsRequest {}

message ListOAuthAccountsResponse {
  repeated OAuthAccount accounts = 1;
}

message UnlinkOAuthAccountRequest {
  string id = 1;
}

message UnlinkOAuthAccountResponse {}

message ListActivityRequest {
  // next_page_token from the previous page.
  string page_token = 1;
}

message ListActivityResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}
