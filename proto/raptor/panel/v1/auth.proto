syntax = "proto3";

package raptor.panel.v1;

import "google/protobuf/timestamp.proto";
import "raptor/panel/v1/audit.proto";

// AuthService signs people in and out of the Panel (docs/PANEL.md#auth).
// The session is a host-only __Host- cookie the Panel sets; nothing here
// returns a token to scripts. Raptor's phone app gets its tokens from
// POST /oauth/token instead, with a code ApproveApp made
// (docs/PANEL.md#the-phone-app).
service AuthService {
  // StartEmailSignIn emails a 6-digit code and a sign-in link for the
  // address (signing up if it's new). The answer is the same whether or not
  // an account exists.
  rpc StartEmailSignIn(StartEmailSignInRequest) returns (StartEmailSignInResponse) {}

  // FinishEmailSignIn checks a code (with its email) or a link token, and
  // starts a session.
  rpc FinishEmailSignIn(FinishEmailSignInRequest) returns (FinishEmailSignInResponse) {}

  // GetDemo says whether the public demo is open (#449): whether a demo
  // org is set up for StartDemo to drop guests into. Anyone may ask.
  rpc GetDemo(GetDemoRequest) returns (GetDemoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // StartDemo starts a guest session in the demo org (#449,
  // docs/PANEL.md#the-public-demo): a throwaway account with no email and
  // no sign-in method, a member of the demo org with its showcase servers'
  // guest grants, that's deleted after an hour. Behind Turnstile and
  // limited per address. FAILED_PRECONDITION when the demo isn't open, or
  // the browser is signed in to a real account.
  rpc StartDemo(StartDemoRequest) returns (StartDemoResponse) {}

  // GetSession returns who's signed in. UNAUTHENTICATED if no one is.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SignOut ends this session.
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {}

  // ListSessions lists the user's devices.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RevokeSession signs one of the user's devices out (or all but this one).
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {}

  // BeginPasskeySignIn starts a passkey sign-in. The browser passes
  // options_json to navigator.credentials.get; no email is needed, since
  // passkeys know their account.
  rpc BeginPasskeySignIn(BeginPasskeySignInRequest) returns (BeginPasskeySignInResponse) {}

  // FinishPasskeySignIn checks the passkey's answer and starts a session.
  rpc FinishPasskeySignIn(FinishPasskeySignInRequest) returns (FinishPasskeySignInResponse) {}

  // BeginPasskeyRegistration starts adding a passkey to the signed-in
  // account. Needs a recent re-authentication.
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse) {}

  // FinishPasskeyRegistration checks the new passkey and saves it.
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse) {}

  // ListPasskeys lists the account's passkeys.
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RenamePasskey renames one of the account's passkeys.
  rpc RenamePasskey(RenamePasskeyRequest) returns (RenamePasskeyResponse) {}

  // DeletePasskey removes one of the account's passkeys. Needs a recent
  // re-authentication.
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse) {}

  // BeginReauth starts confirming it's really the user, before a sensitive
  // account change: with a passkey if the account has one, otherwise with a
  // code emailed to them.
  rpc BeginReauth(BeginReauthRequest) returns (BeginReauthResponse) {}

  // FinishReauth checks the passkey's answer, the authenticator app's code,
  // or the emailed code. A re-authentication lasts 5 minutes.
  rpc FinishReauth(FinishReauthRequest) returns (FinishReauthResponse) {}

  // FinishSecondFactor finishes a sign-in that needed a second factor (an
  // email sign-in to an account with TOTP), with an authenticator app's code
  // or a recovery code. The pending sign-in is in a cookie.
  rpc FinishSecondFactor(FinishSecondFactorRequest) returns (FinishSecondFactorResponse) {}

  // BeginTOTPSetup makes a new authenticator app secret. Needs a recent
  // re-authentication.
  rpc BeginTOTPSetup(BeginTOTPSetupRequest) returns (BeginTOTPSetupResponse) {}

  // FinishTOTPSetup turns TOTP on once a code from the app checks out, and
  // returns new recovery codes (shown once).
  rpc FinishTOTPSetup(FinishTOTPSetupRequest) returns (FinishTOTPSetupResponse) {}

  // DisableTOTP turns TOTP off and deletes the recovery codes. Needs a
  // recent re-authentication.
  rpc DisableTOTP(DisableTOTPRequest) returns (DisableTOTPResponse) {}

  // RegenerateRecoveryCodes replaces the recovery codes. Needs a recent
  // re-authentication.
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse) {}

  // GetSignInMethods says which ways to sign in this Panel offers, for the
  // sign-in page.
  rpc GetSignInMethods(GetSignInMethodsRequest) returns (GetSignInMethodsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // BeginOAuth starts signing in with (or, signed in, linking) a Google,
  // GitHub, or Discord account. It sets a short-lived state cookie and
  // returns the provider's URL, which the web app navigates to; the
  // provider sends the browser back to the API's /oauth/<provider>/callback,
  // which redirects to the web app. Linking needs a recent
  // re-authentication.
  rpc BeginOAuth(BeginOAuthRequest) returns (BeginOAuthResponse) {}

  // ListOAuthAccounts lists the Google, GitHub, and Discord accounts that
  // can sign in to this account.
  rpc ListOAuthAccounts(ListOAuthAccountsRequest) returns (ListOAuthAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UnlinkOAuthAccount stops one signing in. Needs a recent
  // re-authentication.
  rpc UnlinkOAuthAccount(UnlinkOAuthAccountRequest) returns (UnlinkOAuthAccountResponse) {}

  // ListActivity lists the account's sign-ins, failed attempts, and
  // security changes, newest first, 50 at a time.
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UpdateProfile changes the account's name or theme (the theme follows
  // the account to every browser).
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {}

  // SetAvatar sets or removes the account's picture
  // (docs/PANEL.md#images).
  rpc SetAvatar(SetAvatarRequest) returns (SetAvatarResponse) {}

  // StartEmailChange emails a code to the new address. Needs a recent
  // re-authentication: the email address signs in.
  rpc StartEmailChange(StartEmailChangeRequest) returns (StartEmailChangeResponse) {}

  // FinishEmailChange checks the code and moves the account to the new
  // address; the old one is told.
  rpc FinishEmailChange(FinishEmailChangeRequest) returns (FinishEmailChangeResponse) {}

  // DeleteAccount deletes the account and signs it out everywhere. Needs a
  // recent re-authentication. Refused while the account is an org's only
  // owner and the org has other members or nodes.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {}

  // ApproveApp lets Raptor's phone app sign in to this account: the web
  // app calls it from the page the phone opened and sends the code back to
  // the phone, which trades it at POST /oauth/token with its PKCE verifier.
  // Browser sessions only, with a recent re-authentication.
  rpc ApproveApp(ApproveAppRequest) returns (ApproveAppResponse) {}

  // Phone approvals (docs/PANEL.md#phone-approvals): approving a sign-in
  // or a re-authentication from Raptor's phone app instead of typing an
  // authenticator app's code. Only for accounts with TOTP on, which stays
  // the fallback.

  // GetPhoneApprover says whether this app session approves, and whether
  // it can start to. The phone app only.
  rpc GetPhoneApprover(GetPhoneApproverRequest) returns (GetPhoneApproverResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // EnrollPhoneApprover makes this app session an approver, with a secret
  // the app keeps behind Face ID. Only within 15 minutes of the app
  // signing in (which needed a recent confirmation in the browser), and
  // only with TOTP on. The account is emailed.
  rpc EnrollPhoneApprover(EnrollPhoneApproverRequest) returns (EnrollPhoneApproverResponse) {}

  // RemovePhoneApprover stops this app session approving.
  rpc RemovePhoneApprover(RemovePhoneApproverRequest) returns (RemovePhoneApproverResponse) {}

  // StartPhoneApproval asks the account's phones to approve: the browser
  // waiting for a second factor (its pending sign-in), or a browser session
  // confirming it's the person. It shows the number to pick on the phone.
  rpc StartPhoneApproval(StartPhoneApprovalRequest) returns (StartPhoneApprovalResponse) {}

  // CheckPhoneApproval is whether the phone has answered (the browser that
  // asked only).
  rpc CheckPhoneApproval(CheckPhoneApprovalRequest) returns (CheckPhoneApprovalResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListPhoneApprovals lists requests waiting for an answer. The phone app
  // only.
  rpc ListPhoneApprovals(ListPhoneApprovalsRequest) returns (ListPhoneApprovalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DecidePhoneApproval approves (with the number picked) or denies a
  // request, proven with the approver's secret. A wrong number denies it.
  // Denials are emailed.
  rpc DecidePhoneApproval(DecidePhoneApprovalRequest) returns (DecidePhoneApprovalResponse) {}
}

message StartEmailSignInRequest {
  string email = 1;
  // Cloudflare Turnstile's token from the form.
  string turnstile_token = 2;
}

message StartEmailSignInResponse {}

message GetDemoRequest {}

message GetDemoResponse {
  // A demo org is set up, so StartDemo can work.
  bool open = 1;
}

message StartDemoRequest {
  // Cloudflare Turnstile's token from the demo page.
  string turnstile_token = 1;
}

message StartDemoResponse {
  // The demo org, to open.
  string org_id = 1;
  User user = 2;
}

message FinishEmailSignInRequest {
  oneof proof {
    EmailCode code = 1;
    // The token from the emailed link.
    string link_token = 2;
  }
}

message EmailCode {
  string email = 1;
  string code = 2;
}

message FinishEmailSignInResponse {
  User user = 1;
  // The account was created by this sign-in.
  bool new_account = 2;
  // The account has TOTP: the sign-in isn't finished until
  // FinishSecondFactor (user is unset until then).
  bool second_factor_required = 3;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  bool totp_enabled = 4;
  // sftp_username: SSH keys are gone (DECISIONS #223).
  reserved 5;
  reserved "sftp_username";
  google.protobuf.Timestamp created_at = 6;
  // "system", "light", or "dark".
  string theme = 7;
  // "standard", "contrast" (high contrast), or "calm" (neutral, less
  // colour).
  string theme_style = 8;
  // The avatar's image ID (GET /api/images/<id>.png); empty for none.
  string avatar = 9;
  // A demo guest's account (StartDemo): when it's deleted. Unset for real
  // accounts.
  google.protobuf.Timestamp guest_until = 10;
}

message GetSessionRequest {}

message GetSessionResponse {
  User user = 1;
  Session session = 2;
  // Unused recovery codes (0 without TOTP).
  int32 recovery_codes_left = 3;
}

message Session {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp last_seen_at = 3;
  string ip = 4;
  string user_agent = 5;
  // This is the session making the request.
  bool current = 6;
  // Sensitive account changes are allowed until then (the current session
  // only; unset if they need a re-authentication).
  google.protobuf.Timestamp reauth_until = 7;
  // Which app holds the session ("raptor-mobile"); empty for a browser.
  string client = 8;
  // The phone's name, as the app gave it.
  string device_name = 9;
}

message SignOutRequest {}

message SignOutResponse {}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  oneof target {
    string id = 1;
    // Every session but the current one.
    bool all_others = 2;
  }
}

message RevokeSessionResponse {}

// A WebAuthn ceremony the browser runs: options_json is the "publicKey"
// options in WebAuthn's JSON form (for PublicKeyCredential.parse*OptionsFromJSON),
// and ceremony_id comes back with the answer.
message PasskeyChallenge {
  string ceremony_id = 1;
  string options_json = 2;
}

// The browser's answer: PublicKeyCredential.toJSON().
message PasskeyAnswer {
  string ceremony_id = 1;
  string credential_json = 2;
}

message BeginPasskeySignInRequest {}

message BeginPasskeySignInResponse {
  PasskeyChallenge challenge = 1;
}

message FinishPasskeySignInRequest {
  PasskeyAnswer answer = 1;
}

message FinishPasskeySignInResponse {
  User user = 1;
}

message BeginPasskeyRegistrationRequest {}

message BeginPasskeyRegistrationResponse {
  PasskeyChallenge challenge = 1;
}

message FinishPasskeyRegistrationRequest {
  PasskeyAnswer answer = 1;
  // What the user calls it ("Phone", "YubiKey"). Up to 64 characters.
  string name = 2;
}

message FinishPasskeyRegistrationResponse {
  Passkey passkey = 1;
}

message Passkey {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
  // The passkey is synced between devices (iCloud Keychain, Google Password
  // Manager) rather than bound to one device or security key.
  bool synced = 5;
  // For trusting it on a node (keys.pair, keys.add): its WebAuthn
  // credential ID and COSE public key. The browser computes the fingerprint
  // it shows from the key it signs with, not from anything the Panel says.
  bytes credential_id = 6;
  bytes public_key = 7;
}

message ListPasskeysRequest {}

message ListPasskeysResponse {
  repeated Passkey passkeys = 1;
}

message RenamePasskeyRequest {
  string id = 1;
  string name = 2;
}

message RenamePasskeyResponse {}

message DeletePasskeyRequest {
  string id = 1;
}

message DeletePasskeyResponse {}

message BeginReauthRequest {}

message BeginReauthResponse {
  oneof method {
    // The account has passkeys: one of them must answer this.
    PasskeyChallenge passkey = 1;
    // The account has no passkeys or TOTP: a 6-digit code was emailed.
    bool email_sent = 2;
  }
  // The account has TOTP, so a code from the authenticator app works too
  // (or alone, if method is unset).
  bool totp_allowed = 3;
  // The account has a phone that approves (StartPhoneApproval).
  bool phone_allowed = 4;
}

message FinishReauthRequest {
  oneof proof {
    PasskeyAnswer passkey = 1;
    string email_code = 2;
    string totp_code = 3;
    // An approval the phone approved (StartPhoneApproval, purpose reauth).
    string phone_approval_id = 4;
  }
}

message FinishReauthResponse {
  google.protobuf.Timestamp reauth_until = 1;
}

message FinishSecondFactorRequest {
  oneof proof {
    string totp_code = 1;
    string recovery_code = 2;
    // An approval the phone approved (StartPhoneApproval, purpose signin).
    string phone_approval_id = 3;
  }
}

message FinishSecondFactorResponse {
  User user = 1;
  // Unused recovery codes left (when one was used).
  int32 recovery_codes_left = 2;
}

message BeginTOTPSetupRequest {}

message BeginTOTPSetupResponse {
  // Base32, for typing into the app.
  string secret = 1;
  // otpauth:// URL, for a QR code.
  string url = 2;
}

message FinishTOTPSetupRequest {
  string code = 1;
}

message FinishTOTPSetupResponse {
  repeated string recovery_codes = 1;
}

message DisableTOTPRequest {}

message DisableTOTPResponse {}

message RegenerateRecoveryCodesRequest {}

message RegenerateRecoveryCodesResponse {
  repeated string recovery_codes = 1;
}

message GetSignInMethodsRequest {}

message GetSignInMethodsResponse {
  bool email = 1;
  bool passkeys = 2;
  // "google", "github", "discord": the ones set up on this Panel.
  repeated string oauth_providers = 3;
}

message BeginOAuthRequest {
  string provider = 1;
  // Link the provider's account to the signed-in account instead of
  // signing in.
  bool link = 2;
}

message BeginOAuthResponse {
  string url = 1;
}

message OAuthAccount {
  string id = 1;
  string provider = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_used_at = 5;
}

message ListOAuthAccountsRequest {}

message ListOAuthAccountsResponse {
  repeated OAuthAccount accounts = 1;
}

message UnlinkOAuthAccountRequest {
  string id = 1;
}

message UnlinkOAuthAccountResponse {}

message ListActivityRequest {
  // next_page_token from the previous page.
  string page_token = 1;
  ActivityFilter filter = 2;
}

message ListActivityResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}








message UpdateProfileRequest {
  // Unset fields stay as they are.
  optional string name = 1;
  optional string theme = 2;
  optional string theme_style = 3;
}

message UpdateProfileResponse {
  User user = 1;
}

message SetAvatarRequest {
  // A PNG, JPEG, GIF, or WebP of at most 1 MB, cropped square and scaled to
  // 256×256 by the Panel; empty removes the avatar.
  bytes image = 1;
}

message SetAvatarResponse {
  User user = 1;
}

message StartEmailChangeRequest {
  string new_email = 1;
}

message StartEmailChangeResponse {}

message FinishEmailChangeRequest {
  string new_email = 1;
  string code = 2;
}

message FinishEmailChangeResponse {
  User user = 1;
}

message DeleteAccountRequest {}

message DeleteAccountResponse {}

message ApproveAppRequest {
  // The app ("raptor-mobile") and where it asked to be sent back, which
  // must be one of its own addresses.
  string client_id = 1;
  string redirect_uri = 2;
  // PKCE (RFC 7636): base64url(SHA-256(verifier)), S256 only.
  string code_challenge = 3;
  // What to call the phone in the list of devices (at most 64 characters).
  string device_name = 4;
}

message ApproveAppResponse {
  // Single use, for 2 minutes.
  string code = 1;
}

message GetPhoneApproverRequest {}

message GetPhoneApproverResponse {
  bool enrolled = 1;
  // It isn't, and could be now.
  bool can_enroll = 2;
  // Why it can't, in words, when it isn't and can't.
  string reason = 3;
}

message EnrollPhoneApproverRequest {
  // 32 random bytes the app made and keeps behind Face ID.
  bytes secret = 1;
}

message EnrollPhoneApproverResponse {}

message RemovePhoneApproverRequest {}

message RemovePhoneApproverResponse {}

message StartPhoneApprovalRequest {
  // "signin" (with the pending sign-in's cookie) or "reauth" (a browser
  // session).
  string purpose = 1;
}

message StartPhoneApprovalResponse {
  string approval_id = 1;
  // What to pick on the phone.
  int32 number = 2;
  google.protobuf.Timestamp expires_at = 3;
  // How many phones were sent a notification (0: none have push on; the
  // request still shows when the app is opened).
  int32 notified = 4;
}

message CheckPhoneApprovalRequest {
  string approval_id = 1;
}

message CheckPhoneApprovalResponse {
  // pending, approved, denied, or expired.
  string status = 1;
}

message ListPhoneApprovalsRequest {}

message PhoneApproval {
  string id = 1;
  // signin or reauth.
  string purpose = 2;
  // The numbers to offer, one of them the browser's.
  repeated int32 choices = 3;
  // What the answer's MAC covers (see DecidePhoneApprovalRequest).
  bytes challenge = 4;
  // Where it's from.
  string ip = 5;
  string user_agent = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message ListPhoneApprovalsResponse {
  repeated PhoneApproval approvals = 1;
}

message DecidePhoneApprovalRequest {
  string approval_id = 1;
  bool approve = 2;
  // The number picked (approving only; 0 when denying).
  int32 number = 3;
  // HMAC-SHA256 with the approver's secret over the lines
  // "raptor approval v1", the approval ID, base64url(challenge),
  // "approve" or "deny", and the number, joined by newlines.
  bytes mac = 4;
}

message DecidePhoneApprovalResponse {
  // approved or denied.
  string status = 1;
}
