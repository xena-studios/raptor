syntax = "proto3";

package raptor.panel.v1;

import "google/protobuf/timestamp.proto";

// SubdomainService gives servers player-facing names on the node domain
// (docs/PANEL.md#subdomains): smp.raptornodes.net points at the server's
// node, with an SRV record for Minecraft so players type the name alone.
// Members of the org see them; admins and owners add and remove them.
service SubdomainService {
  // ListSubdomains lists an org's subdomains, and the domain they're on
  // (empty while this Panel doesn't offer them).
  rpc ListSubdomains(ListSubdomainsRequest) returns (ListSubdomainsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CheckSubdomain says whether a name can be had.
  rpc CheckSubdomain(CheckSubdomainRequest) returns (CheckSubdomainResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateSubdomain gives a server a name. ALREADY_EXISTS if it's taken or
  // the server has one.
  rpc CreateSubdomain(CreateSubdomainRequest) returns (CreateSubdomainResponse) {}

  // DeleteSubdomain removes one. Its name stays the org's for 30 days.
  rpc DeleteSubdomain(DeleteSubdomainRequest) returns (DeleteSubdomainResponse) {}
}

message Subdomain {
  string id = 1;
  string node_id = 2;
  string server_id = 3;
  // The label alone ("smp"); the full name is name + "." + the domain.
  string name = 4;
  google.protobuf.Timestamp created_at = 5;
  // Whether its records are written. False until the Panel writes them
  // (within a minute), or while writing them fails (error says why).
  bool live = 6;
  string error = 7;
}

message ListSubdomainsRequest {
  string org_id = 1;
}

message ListSubdomainsResponse {
  repeated Subdomain subdomains = 1;
  // raptornodes.net; empty if this Panel doesn't offer subdomains.
  string domain = 2;
  // How many an org may have.
  int32 limit = 3;
}

message CheckSubdomainRequest {
  string org_id = 1;
  string name = 2;
}

message CheckSubdomainResponse {
  bool available = 1;
  // Why not, for people.
  string reason = 2;
}

message CreateSubdomainRequest {
  string org_id = 1;
  string node_id = 2;
  string server_id = 3;
  string name = 4;
}

message CreateSubdomainResponse {
  Subdomain subdomain = 1;
}

message DeleteSubdomainRequest {
  string org_id = 1;
  string id = 2;
}

message DeleteSubdomainResponse {}
