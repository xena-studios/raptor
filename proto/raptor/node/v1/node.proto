syntax = "proto3";

package raptor.node.v1;

import "google/protobuf/timestamp.proto";

// The node connection (docs/ARCHITECTURE.md#node-connection): one WebSocket
// that Wings opens to the Panel, with yamux inside. Each side serves one of
// these services and calls the other's, each call on its own yamux stream.

// NodeService is served by Wings and called by the Panel.
service NodeService {
  // Execute runs a command at most once (docs/ARCHITECTURE.md#commands-are-idempotent).
  // A retry with the same command_id returns the stored outcome, so the
  // Panel retries until it gets an answer. Errors are the command being
  // refused (bad grant, signature, expired, ...); a command that ran and
  // failed answers with error set. ABORTED means it's still running from an
  // earlier attempt: try again shortly.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Events returns events after after_seq, oldest first, and records that
  // the Panel has everything up to after_seq. FAILED_PRECONDITION means
  // events after after_seq were already pruned: the Panel needs a snapshot.
  rpc Events(EventsRequest) returns (EventsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // OpenTransfer asks Wings to open a transfer connection for an upload or
  // download started by a files.upload or files.download command. It
  // returns once the connection is up. The connection carries that
  // transfer's chunks only, so a large file never slows this one
  // (docs/ARCHITECTURE.md#files-and-sftp).
  rpc OpenTransfer(OpenTransferRequest) returns (OpenTransferResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetServers returns servers as they are now, for the Panel's mirror
  // (docs/ARCHITECTURE.md#mirror-sync): the ones named, or every server if
  // none are (a snapshot). last_seq is the newest event when it was read, so
  // the result reflects at least every event up to it.
  rpc GetServers(GetServersRequest) returns (GetServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Console streams a server's console: its history, then new lines as
  // they come, until the Panel hangs up. The request is an envelope for
  // "server.console" with the Panel's grant, checked like a command's.
  rpc Console(ConsoleRequest) returns (stream ConsoleResponse) {}
}

message GetServersRequest {
  repeated string ids = 1;
}

message GetServersResponse {
  repeated Server servers = 1;
  // Named servers that don't exist (deleted).
  repeated string missing = 2;
  int64 last_seq = 3;
}

// Server is a server as Wings has it.
message Server {
  string id = 1;
  string name = 2;
  // Bumped on every configuration change.
  int64 version = 3;
  // Runtime state: installing, install_failed, offline, starting, running,
  // stopping, crashed.
  string state = 4;
  // "running" or "stopped": what Wings keeps it at.
  string desired_state = 5;
  string install_state = 6;
  string install_error = 7;
  string egg_name = 8;
  string egg_source = 9;
  // The rest of the configuration as JSON: image, startup, variables,
  // limits, settings, host_network, allocations.
  bytes config = 10;
  // Unix milliseconds.
  int64 created_at = 11;
  int64 updated_at = 12;
  repeated Schedule schedules = 13;
  // Backups of this server (a deleted server's final backup isn't here).
  repeated Backup backups = 14;
  // The server's 50 most recent jobs (installs, backups, archives,
  // schedule runs), newest first.
  repeated Job jobs = 15;
}

message Job {
  string id = 1;
  // "server.install", "backup.create", "files.compress", ...
  string type = 2;
  // "queued", "running", "succeeded", "failed", "cancelled"
  string status = 3;
  int32 attempts = 4;
  // Why it failed, or why the last attempt did if it's queued for a retry.
  string error = 5;
  // Unix milliseconds; 0 if not set.
  int64 created_at = 6;
  int64 started_at = 7;
  int64 finished_at = 8;
}

message Schedule {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  int64 version = 4;
  // Unix milliseconds; 0 when disabled / never ran.
  int64 next_run = 5;
  int64 last_run = 6;
  // The full definition as JSON (cron, timezone, steps, ...).
  bytes definition = 7;
}

message Backup {
  string id = 1;
  // "manual", "scheduled", "safety", "final", ...
  string kind = 2;
  // "pending", "running", "ok", "failed"
  string status = 3;
  bool locked = 4;
  int64 size = 5;
  int64 files = 6;
  string destination_id = 7;
  string error = 8;
  string warning = 9;
  string created_by = 10;
  // Unix milliseconds; 0 if not set.
  int64 created_at = 11;
  int64 finished_at = 12;
  int64 expires_at = 13;
}

message OpenTransferRequest {
  // The upload_id or download_id.
  string transfer_id = 1;
  // The path that reaches the Panel instance asking ("/i/panel-a"), which
  // Wings puts before the connection's path: with several instances behind
  // one proxy, the transfer connection must reach the one waiting for it.
  // Empty: the Panel URL as it is.
  string route = 2;
}

message OpenTransferResponse {}

message ExecuteRequest {
  // The command envelope as JSON (internal/wings/command.Envelope): the
  // grant and passkey signature cover its canonical form, so it travels
  // as the Panel built it.
  bytes envelope = 1;
}

message ExecuteResponse {
  // The command's result as JSON, if it has one.
  bytes result = 1;
  // The command had already run; this is the stored outcome.
  bool duplicate = 2;
  // The command ran and failed.
  string error = 3;
}

message EventsRequest {
  int64 after_seq = 1;
  int32 limit = 2;
}

message EventsResponse {
  repeated Event events = 1;
  // The newest event's sequence number on the node.
  int64 last_seq = 2;
}

message Event {
  int64 seq = 1;
  string type = 2;
  string server_id = 3;
  int64 version = 4;
  // Unix milliseconds.
  int64 at = 5;
  // JSON object.
  bytes data = 6;
}

// PanelService is served by the Panel and called by Wings.
service PanelService {
  // EventsAvailable tells the Panel the node has events up to last_seq, so
  // it pulls them (Events) without polling.
  rpc EventsAvailable(EventsAvailableRequest) returns (EventsAvailableResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SFTPLogin asks whether a temporary password may log in to a server on this node
  // over SFTP, and with which permissions. PERMISSION_DENIED if not.
  rpc SFTPLogin(SFTPLoginRequest) returns (SFTPLoginResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message SFTPLoginRequest {
  // The part of the SFTP username before the last dot.
  string username = 1;
  // The server's full ID (Wings resolved the short one).
  string server_id = 2;
  // Ignored: SSH keys are gone (DECISIONS #223); older Wings still send it.
  bytes public_key = 3 [deprecated = true];
  // The temporary password the user turned on for this server.
  string password = 4;
}

message SFTPLoginResponse {
  string user_id = 1;
  // Of "sftp", "files.read", "files.write".
  repeated string permissions = 2;
  // When the password stops working; the node ends its sessions then.
  google.protobuf.Timestamp expires_at = 3;
}

message EventsAvailableRequest {
  int64 last_seq = 1;
}

message EventsAvailableResponse {}

// EnrollmentService is served by the Panel at its API URL (plain HTTPS,
// before the node has a connection): `raptor link --token` calls it once
// (docs/ARCHITECTURE.md#enrollment).
service EnrollmentService {
  // Enroll trades a join token for a node identity. The token is single use,
  // but repeating an enrollment with the same token and key (its answer was
  // lost) returns the same node.
  rpc Enroll(EnrollRequest) returns (EnrollResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message EnrollRequest {
  // rpt_join_…
  string token = 1;
  // The node's Ed25519 public key, generated on the box.
  bytes public_key = 2;
  // The node key's signature over the enrollment (nodelink.EnrollPayload),
  // proving the node holds the key it's enrolling.
  bytes signature = 3;
  // A name for the node (its hostname), shown in the Panel.
  string name = 4;
  string wings_version = 5;
  NodeFacts facts = 6;
  // Set to re-link an existing node (`raptor relink`): one whose key was
  // revoked or that was removed in the Panel. It keeps its ID and hostname
  // and takes the new key; the token must be from the node's org.
  string node_id = 7;
}

// NodeFacts describe the box, for the Panel to show.
message NodeFacts {
  string os = 1;
  string arch = 2;
  string kernel = 3;
  int32 cpus = 4;
  int64 memory_bytes = 5;
}

message EnrollResponse {
  string node_id = 1;
  // The node's hostname is n-<short_id>.raptornodes.net.
  string short_id = 2;
  // The Panel's Ed25519 signing key, which the node pins.
  bytes panel_key = 3;
  // The owner's passkey, signed when they made the join token
  // (nodecmd.OwnerPin as JSON); empty if they didn't. The node checks it
  // and pins the key (LocalService.PinOwnerKey).
  bytes owner_pin = 4;
  // The node's full hostname, n-<short_id>.<the Panel's node domain>,
  // which the node keeps for raptor doctor's hostname check.
  string hostname = 5;
}

message ConsoleRequest {
  // The JSON command envelope (action "server.console").
  bytes envelope = 1;
}

message ConsoleResponse {
  repeated string lines = 1;
  // The lines are the console's history: the first message is, even when
  // empty; the rest are new lines.
  bool history = 2;
}
