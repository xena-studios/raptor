syntax = "proto3";

package raptor.wings.local.v1;

import "google/protobuf/timestamp.proto";

// LocalService is served by Wings on its Unix socket (/run/raptor/wings.sock)
// for the raptor CLI and TUI. Access is controlled by socket permissions.
// It has no methods that change server configuration (docs/WINGS.md).
// Methods are added as the features behind them are built.
service LocalService {
  // GetStatus reports node health.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ShutdownServers gracefully stops every running server with its egg's
  // stop command, without changing whether it should run, so servers start
  // again when the host is back. Called by raptor-shutdown.service when the
  // host shuts down. Root only.
  rpc ShutdownServers(ShutdownServersRequest) returns (ShutdownServersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListServers lists every server with its state and resource usage. It
  // takes about half a second (CPU usage is measured over an interval).
  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Power starts, stops, restarts, or kills a server and returns when it's
  // done (a stop can take up to the server's stop timeout). Root only.
  rpc Power(PowerRequest) returns (PowerResponse) {}

  // StreamConsole sends the console history and then live console output
  // until the client disconnects or the server is deleted.
  rpc StreamConsole(StreamConsoleRequest) returns (stream StreamConsoleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SendCommand writes a command to a running server's console. Root only.
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse) {}

  // TailLogs sends a server's output from Docker's log store, which goes
  // back further than the console history, optionally following it.
  rpc TailLogs(TailLogsRequest) returns (stream TailLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListBackups lists a server's backups, newest first, or every backup on
  // the node (including offsite backups of deleted servers).
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateBackup backs up a server to its destination. Root only.
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse) {}

  // RestoreBackup replaces a server's files with one of its backups, after
  // taking a safety backup of the current files. The server is stopped
  // meanwhile and started again if it was meant to be running. Root only.
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse) {}

  // Update installs another Wings version: the one asked for, else the
  // pinned one, else the newest in the node's channel. Wings downloads and
  // verifies it, then restarts to run it on trial (servers keep running); if
  // it isn't healthy within 5 minutes, Wings rolls back. The reply comes
  // before the restart: GetStatus reports how the update went. Checking is
  // open to the raptor group; installing is root only.
  rpc Update(UpdateRequest) returns (UpdateResponse) {}
}

// Servers are named in requests by full ID, the last 8 or more characters of
// the ID (the short ID shown by `raptor ps`), or exact name. Ambiguous names
// are an error.

message ListServersRequest {}

message ListServersResponse {
  repeated ServerInfo servers = 1;
}

message ServerInfo {
  string id = 1;
  string name = 2;
  // installing, install_failed, restoring, deleting, offline, starting, running, stopping, crashed
  string state = 3;
  // Set while running.
  google.protobuf.Timestamp running_since = 4;
  // Percent of one CPU core; 0 unless the container is up (starting,
  // running, or stopping).
  double cpu_percent = 5;
  int64 memory_bytes = 6;
  int64 memory_limit_bytes = 7;
  int64 disk_bytes = 8;
  // 0 = unlimited.
  int64 disk_limit_bytes = 9;
  // The primary allocation, "ip:port".
  string address = 10;
  // Why the last install failed, if it did.
  string install_error = 11;
}

enum PowerAction {
  POWER_ACTION_UNSPECIFIED = 0;
  POWER_ACTION_START = 1;
  POWER_ACTION_STOP = 2;
  POWER_ACTION_RESTART = 3;
  POWER_ACTION_KILL = 4;
}

message PowerRequest {
  string server = 1;
  PowerAction action = 2;
}

message PowerResponse {
  string server_id = 1;
  // The state after the action.
  string state = 2;
}

message StreamConsoleRequest {
  string server = 1;
}

// One console line.
message StreamConsoleResponse {
  string text = 1;
}

message SendCommandRequest {
  string server = 1;
  string command = 2;
}

message SendCommandResponse {}

message TailLogsRequest {
  string server = 1;
  // Lines of history; 0 = 100, negative = all.
  int32 lines = 2;
  bool follow = 3;
}

// One line of output.
message TailLogsResponse {
  google.protobuf.Timestamp time = 1;
  string text = 2;
}

// Backups are named in requests by full ID or the last 8 or more
// characters of it.

message ListBackupsRequest {
  // Empty = every backup on the node.
  string server = 1;
}

message ListBackupsResponse {
  repeated BackupInfo backups = 1;
}

message BackupInfo {
  string id = 1;
  string server_id = 2;
  // Empty if the server was deleted (its offsite backups are kept).
  string server_name = 3;
  string destination_id = 4;
  // manual, scheduled, or safety (taken before a restore).
  string kind = 5;
  // pending, running, ok, or failed.
  string status = 6;
  // Never deleted by retention.
  bool locked = 7;
  // Total size of the files.
  int64 size_bytes = 8;
  int64 files = 9;
  // New data this backup added to the repository.
  int64 uploaded_bytes = 10;
  string warning = 11;
  string error = 12;
  // "local:<user>", "schedule:<id>", a Panel user ID, or "backup".
  string created_by = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp finished_at = 15;
  // Safety backups expire.
  google.protobuf.Timestamp expires_at = 16;
  string job_id = 17;
}

message CreateBackupRequest {
  string server = 1;
  // Keep it until it's unlocked (in the Panel).
  bool locked = 2;
  // Return when the backup is finished instead of when it's queued. A
  // failed backup is then an error.
  bool wait = 3;
}

message CreateBackupResponse {
  BackupInfo backup = 1;
}

message RestoreBackupRequest {
  string server = 1;
  string backup = 2;
  // Return when the restore is finished instead of when it's queued. A
  // failed restore is then an error.
  bool wait = 3;
}

message RestoreBackupResponse {
  string job_id = 1;
  // The backup of the files the restore replaced (set when waiting; empty
  // if the server's directory was empty).
  string safety_backup_id = 2;
}

message ShutdownServersRequest {}

message ShutdownServersResponse {
  // How many servers were running and were stopped.
  int32 stopped = 1;
  // Servers that didn't stop cleanly, as "<server id>: <error>".
  repeated string errors = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  string version = 1;
  string commit = 2;
  // Empty until the node is linked to the Panel.
  string node_id = 3;
  string panel_url = 4;
  google.protobuf.Timestamp started_at = 5;
  DockerStatus docker = 6;
  // The Unix user the request was attributed to, e.g. "root".
  string caller = 7;
  // Unset until the container runtime is ready.
  ServerCounts servers = 8;
  StorageStatus storage = 9;
  // The last update; unset if there hasn't been one.
  UpdateStatus update = 10;
  // Free space where Wings and Docker keep their state; unset if the check
  // is off (limits.host_disk_min_free: 0).
  HostDiskStatus host_disk = 11;
  // Unset until the container runtime is ready.
  SFTPStatus sftp = 12;
}

// SFTPStatus is the node's SFTP server.
message SFTPStatus {
  bool enabled = 1;
  // 0 while off.
  int32 port = 2;
  string host_key_fingerprint = 3;
}

// HostDiskStatus is free space on the host disk.
message HostDiskStatus {
  // Below min_free on any path: installs and image pulls are refused.
  bool low = 1;
  int64 min_free = 2;
  repeated DiskSpace disks = 3;
}

// DiskSpace is one watched path's filesystem.
message DiskSpace {
  string path = 1;
  int64 total = 2;
  int64 free = 3;
}

message UpdateStatus {
  // trial (installed, being tried), succeeded, or failed (rolled back).
  string status = 1;
  string from = 2;
  string to = 3;
  // Why it failed.
  string error = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message ServerCounts {
  int32 total = 1;
  // Starting, running, or stopping.
  int32 up = 2;
}

message StorageStatus {
  string path = 1;
  // Disk limits are enforced by project quotas (false: soft limits).
  bool quotas = 2;
  // Servers can be installed and started.
  bool ready = 3;
  // Why not, if not ready.
  string error = 4;
}

message DockerStatus {
  bool reachable = 1;
  string version = 2;
  string error = 3;
}

message UpdateRequest {
  // Only report what would be installed.
  bool check = 1;
  // A version like "1.4.2", instead of the pin or channel. It may be older
  // than the running one.
  string version = 2;
}

message UpdateResponse {
  // The running version.
  string current = 1;
  // The version picked; the running one when it's up to date.
  string target = 2;
  // Where target came from: the channel ("stable" or "beta"), "pin", or
  // "requested".
  string channel = 3;
  // target differs from the running version.
  bool available = 4;
  // Wings is restarting to run target on trial.
  bool started = 5;
}
