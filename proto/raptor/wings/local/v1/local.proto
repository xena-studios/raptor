syntax = "proto3";

package raptor.wings.local.v1;

import "google/protobuf/timestamp.proto";

// LocalService is served by Wings on its Unix socket (/run/raptor/wings.sock)
// for the raptor CLI and TUI. Access is controlled by socket permissions.
// It has no methods that change server configuration (docs/WINGS.md).
// Methods are added as the features behind them are built.
service LocalService {
  // GetStatus reports node health.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ShutdownServers gracefully stops every running server with its egg's
  // stop command, without changing whether it should run, so servers start
  // again when the host is back. Called by raptor-shutdown.service when the
  // host shuts down. Root only.
  rpc ShutdownServers(ShutdownServersRequest) returns (ShutdownServersResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListServers lists every server with its state and resource usage. It
  // takes about half a second (CPU usage is measured over an interval).
  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Power starts, stops, restarts, or kills a server and returns when it's
  // done (a stop can take up to the server's stop timeout). Root only.
  rpc Power(PowerRequest) returns (PowerResponse) {}

  // StreamConsole sends the console history and then live console output
  // until the client disconnects or the server is deleted.
  rpc StreamConsole(StreamConsoleRequest) returns (stream StreamConsoleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SendCommand writes a command to a running server's console. Root only.
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse) {}

  // TailLogs sends a server's output from Docker's log store, which goes
  // back further than the console history, optionally following it.
  rpc TailLogs(TailLogsRequest) returns (stream TailLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListBackups lists a server's backups, newest first, or every backup on
  // the node (including offsite backups of deleted servers).
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateBackup backs up a server to its destination. Root only.
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse) {}

  // RestoreBackup replaces a server's files with one of its backups, after
  // taking a safety backup of the current files. The server is stopped
  // meanwhile and started again if it was meant to be running. Root only.
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse) {}

  // Update installs another Wings version: the one asked for, else the
  // pinned one, else the newest in the node's channel. Wings downloads and
  // verifies it, then restarts to run it on trial (servers keep running); if
  // it isn't healthy within 5 minutes, Wings rolls back. The reply comes
  // before the restart: GetStatus reports how the update went. Checking is
  // open to the raptor group; installing is root only.
  rpc Update(UpdateRequest) returns (UpdateResponse) {}

  // ListKeys lists the passkeys this node trusts for signed actions, and
  // delegations.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListAudit lists signed dangerous actions (run or rejected) and key
  // resets, newest first, from the node's own records.
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // StartKeyReset begins re-pairing the node's owner passkey: it returns a
  // one-time code for the owner to enter in the Panel. Nothing changes until
  // ConfirmKeyReset. Root only.
  rpc StartKeyReset(StartKeyResetRequest) returns (StartKeyResetResponse) {}

  // GetKeyReset reports a key reset's state: waiting for the Panel, or a
  // key waiting for root to confirm its fingerprint. Root only.
  rpc GetKeyReset(GetKeyResetRequest) returns (GetKeyResetResponse) {}

  // ConfirmKeyReset pins the key that paired as the node's only owner key,
  // removing every other trusted key and delegation. Root only.
  rpc ConfirmKeyReset(ConfirmKeyResetRequest) returns (ConfirmKeyResetResponse) {}

  // CancelKeyReset ends a key reset without changing any key. Root only.
  rpc CancelKeyReset(CancelKeyResetRequest) returns (CancelKeyResetResponse) {}

  // TestNotifications sends a test message to every notification target in
  // config.yml and reports how each went. Root only.
  rpc TestNotifications(TestNotificationsRequest) returns (TestNotificationsResponse) {}

  // ImportServer creates a server from another panel's (raptor import):
  // its configuration, and a copy of its directory. The original is left
  // as it was. Root only.
  rpc ImportServer(ImportServerRequest) returns (ImportServerResponse) {}

  // GetMetrics returns a server's resource history and its latest sample.
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Servers are named in requests by full ID, the last 8 or more characters of
// the ID (the short ID shown by `raptor ps`), or exact name. Ambiguous names
// are an error.

message ListServersRequest {}

message ListServersResponse {
  repeated ServerInfo servers = 1;
}

message ServerInfo {
  string id = 1;
  string name = 2;
  // installing, install_failed, restoring, deleting, offline, starting, running, stopping, crashed
  string state = 3;
  // Set while running.
  google.protobuf.Timestamp running_since = 4;
  // Percent of one CPU core; 0 unless the container is up (starting,
  // running, or stopping).
  double cpu_percent = 5;
  int64 memory_bytes = 6;
  int64 memory_limit_bytes = 7;
  int64 disk_bytes = 8;
  // 0 = unlimited.
  int64 disk_limit_bytes = 9;
  // The primary allocation, "ip:port".
  string address = 10;
  // Why the last install failed, if it did.
  string install_error = 11;
}

enum PowerAction {
  POWER_ACTION_UNSPECIFIED = 0;
  POWER_ACTION_START = 1;
  POWER_ACTION_STOP = 2;
  POWER_ACTION_RESTART = 3;
  POWER_ACTION_KILL = 4;
}

message PowerRequest {
  string server = 1;
  PowerAction action = 2;
}

message PowerResponse {
  string server_id = 1;
  // The state after the action.
  string state = 2;
}

message StreamConsoleRequest {
  string server = 1;
}

// One console line.
message StreamConsoleResponse {
  string text = 1;
}

message SendCommandRequest {
  string server = 1;
  string command = 2;
}

message SendCommandResponse {}

message TailLogsRequest {
  string server = 1;
  // Lines of history; 0 = 100, negative = all.
  int32 lines = 2;
  bool follow = 3;
}

// One line of output.
message TailLogsResponse {
  google.protobuf.Timestamp time = 1;
  string text = 2;
}

// Backups are named in requests by full ID or the last 8 or more
// characters of it.

message ListBackupsRequest {
  // Empty = every backup on the node.
  string server = 1;
}

message ListBackupsResponse {
  repeated BackupInfo backups = 1;
}

message BackupInfo {
  string id = 1;
  string server_id = 2;
  // Empty if the server was deleted (its offsite backups are kept).
  string server_name = 3;
  string destination_id = 4;
  // manual, scheduled, or safety (taken before a restore).
  string kind = 5;
  // pending, running, ok, or failed.
  string status = 6;
  // Never deleted by retention.
  bool locked = 7;
  // Total size of the files.
  int64 size_bytes = 8;
  int64 files = 9;
  // New data this backup added to the repository.
  int64 uploaded_bytes = 10;
  string warning = 11;
  string error = 12;
  // "local:<user>", "schedule:<id>", a Panel user ID, or "backup".
  string created_by = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp finished_at = 15;
  // Safety backups expire.
  google.protobuf.Timestamp expires_at = 16;
  string job_id = 17;
}

message CreateBackupRequest {
  string server = 1;
  // Keep it until it's unlocked (in the Panel).
  bool locked = 2;
  // Return when the backup is finished instead of when it's queued. A
  // failed backup is then an error.
  bool wait = 3;
}

message CreateBackupResponse {
  BackupInfo backup = 1;
}

message RestoreBackupRequest {
  string server = 1;
  string backup = 2;
  // Return when the restore is finished instead of when it's queued. A
  // failed restore is then an error.
  bool wait = 3;
}

message RestoreBackupResponse {
  string job_id = 1;
  // The backup of the files the restore replaced (set when waiting; empty
  // if the server's directory was empty).
  string safety_backup_id = 2;
}

message ShutdownServersRequest {}

message ShutdownServersResponse {
  // How many servers were running and were stopped.
  int32 stopped = 1;
  // Servers that didn't stop cleanly, as "<server id>: <error>".
  repeated string errors = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  string version = 1;
  string commit = 2;
  // Empty until the node is linked to the Panel.
  string node_id = 3;
  string panel_url = 4;
  google.protobuf.Timestamp started_at = 5;
  DockerStatus docker = 6;
  // The Unix user the request was attributed to, e.g. "root".
  string caller = 7;
  // Unset until the container runtime is ready.
  ServerCounts servers = 8;
  StorageStatus storage = 9;
  // The last update; unset if there hasn't been one.
  UpdateStatus update = 10;
  // Free space where Wings and Docker keep their state; unset if the check
  // is off (limits.host_disk_min_free: 0).
  HostDiskStatus host_disk = 11;
  // Unset until the container runtime is ready.
  SFTPStatus sftp = 12;
}

// SFTPStatus is the node's SFTP server.
message SFTPStatus {
  bool enabled = 1;
  // 0 while off.
  int32 port = 2;
  string host_key_fingerprint = 3;
}

// HostDiskStatus is free space on the host disk.
message HostDiskStatus {
  // Below min_free on any path: installs and image pulls are refused.
  bool low = 1;
  int64 min_free = 2;
  repeated DiskSpace disks = 3;
}

// DiskSpace is one watched path's filesystem.
message DiskSpace {
  string path = 1;
  int64 total = 2;
  int64 free = 3;
}

message UpdateStatus {
  // trial (installed, being tried), succeeded, or failed (rolled back).
  string status = 1;
  string from = 2;
  string to = 3;
  // Why it failed.
  string error = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message ServerCounts {
  int32 total = 1;
  // Starting, running, or stopping.
  int32 up = 2;
}

message StorageStatus {
  string path = 1;
  // Disk limits are enforced by project quotas (false: soft limits).
  bool quotas = 2;
  // Servers can be installed and started.
  bool ready = 3;
  // Why not, if not ready.
  string error = 4;
}

message DockerStatus {
  bool reachable = 1;
  string version = 2;
  string error = 3;
}

message UpdateRequest {
  // Only report what would be installed.
  bool check = 1;
  // A version like "1.4.2", instead of the pin or channel. It may be older
  // than the running one.
  string version = 2;
}

message UpdateResponse {
  // The running version.
  string current = 1;
  // The version picked; the running one when it's up to date.
  string target = 2;
  // Where target came from: the channel ("stable" or "beta"), "pin", or
  // "requested".
  string channel = 3;
  // target differs from the running version.
  bool available = 4;
  // Wings is restarting to run target on trial.
  bool started = 5;
}

message ListKeysRequest {}

message ListKeysResponse {
  repeated TrustedKey keys = 1;
}

// TrustedKey is a passkey the node trusts.
message TrustedKey {
  string fingerprint = 1;
  string user_id = 2;
  string name = 3;
  // "owner" (every signed action) or "delegate" (the actions below).
  string role = 4;
  // Delegates: the server ("" = every server) and actions.
  string server_id = 5;
  repeated string actions = 6;
  // Delegates: unset = never.
  google.protobuf.Timestamp expires_at = 7;
  // The fingerprint of the key that added this one; empty if it was pinned
  // on the box (enrollment or a key reset).
  string added_by = 8;
  google.protobuf.Timestamp added_at = 9;
}

message ListAuditRequest {
  // At most this many (default 50, at most 10000).
  int32 limit = 1;
  // Only entries since this time.
  google.protobuf.Timestamp since = 2;
}

message ListAuditResponse {
  repeated AuditEntry entries = 1;
}

// AuditEntry is one signed action or key reset.
message AuditEntry {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  string action = 3;
  string server_id = 4;
  // The Panel user, or local:<unix user> on the box.
  string user_id = 5;
  // The signing key: its name and fingerprint while it's still trusted.
  string key_name = 6;
  string key_fingerprint = 7;
  // running, ok, failed, or rejected.
  string outcome = 8;
  // The error, or why it was rejected.
  string detail = 9;
  string command_id = 10;
  // Hex SHA-256 of the canonical command: what the passkey signed.
  string command_hash = 11;
}

message StartKeyResetRequest {}

message StartKeyResetResponse {
  string reset_id = 1;
  // "XXXXX-XXXXX"; shown only on the box.
  string code = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message GetKeyResetRequest {
  string reset_id = 1;
}

message GetKeyResetResponse {
  // waiting, pending (a key paired and waits for confirmation), done, or
  // expired (also after cancelling or too many wrong codes).
  string state = 1;
  google.protobuf.Timestamp expires_at = 2;
  // pending: the key that paired.
  string fingerprint = 3;
  string user_id = 4;
  string name = 5;
}

message ConfirmKeyResetRequest {
  string reset_id = 1;
  // The fingerprint root was shown and compared with the browser.
  string fingerprint = 2;
}

message ConfirmKeyResetResponse {}

message CancelKeyResetRequest {
  string reset_id = 1;
}

message CancelKeyResetResponse {}

message TestNotificationsRequest {}

message TestNotificationsResponse {
  repeated NotificationResult results = 1;
}

// NotificationResult is how a test message went for one target.
message NotificationResult {
  string target = 1;
  // Empty if it was delivered.
  string error = 2;
}

message GetMetricsRequest {
  string server = 1;
  // History since this time (default: the last hour). Older than a day is
  // in 15-minute points; the last day in minute points.
  google.protobuf.Timestamp since = 2;
}

message GetMetricsResponse {
  // The last sample (every 10 seconds); traffic is per second.
  MetricPoint latest = 1;
  repeated MetricPoint points = 2;
}

// MetricPoint is a server's resources over one bucket.
message MetricPoint {
  google.protobuf.Timestamp at = 1;
  // Seconds the point covers: 60 or 900; 0 for a live sample.
  int32 resolution = 2;
  // Samples taken while the server ran (0: it was stopped).
  int32 samples = 3;
  // Percent of one core.
  double cpu_avg = 4;
  double cpu_max = 5;
  int64 memory_avg = 6;
  int64 memory_max = 7;
  int64 rx_bytes = 8;
  int64 tx_bytes = 9;
  int64 disk_bytes = 10;
  // Unset when the game isn't queried, or didn't answer.
  optional double players_avg = 11;
  optional int32 players_max = 12;
}

message ImportServerRequest {
  string name = 1;
  // The egg file (JSON or YAML).
  bytes egg = 2;
  // Where the egg came from, e.g. "pterodactyl:1/5".
  string egg_source = 3;
  string image = 4;
  string startup = 5;
  map<string, string> variables = 6;
  ImportLimits limits = 7;
  repeated ImportAllocation allocations = 8;
  // The server's directory on this box, copied into Raptor's volume.
  string source_dir = 9;
}

// ImportLimits are a server's limits; 0 = none.
message ImportLimits {
  int64 memory_mib = 1;
  int64 swap_mib = 2;
  int64 disk_mib = 3;
  // 100 = one core.
  int64 cpu_percent = 4;
  string cpuset = 5;
}

// ImportAllocation is an IP and port.
message ImportAllocation {
  string ip = 1;
  int32 port = 2;
  bool primary = 3;
}

message ImportServerResponse {
  string server_id = 1;
  int64 files = 2;
  int64 bytes = 3;
  // Special files (FIFOs, devices) left out.
  int64 skipped = 4;
}
