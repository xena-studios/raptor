version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/xena-studios/raptor/internal/gen/proto
plugins:
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-go"]
    out: internal/gen/proto
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-connect-go"]
    out: internal/gen/proto
    opt:
      - paths=source_relative
      - simple
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
