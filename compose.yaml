# Local development services. Ports bind to localhost only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: raptor
      POSTGRES_PASSWORD: raptor
      POSTGRES_DB: raptor
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "raptor"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Disposable database for tests: in-memory, durability off for speed.
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: raptor
      POSTGRES_PASSWORD: raptor
      POSTGRES_DB: raptor_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "127.0.0.1:54321:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "raptor"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
